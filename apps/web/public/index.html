<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ATLAS Enterprise Suite</title>
  <style>
    :root{color-scheme:dark;background:#06080d;color:#eef4ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 15%,#19324f55,transparent 35%),linear-gradient(180deg,#05070b,#0a1018 55%,#05070b)}
    .shell{min-height:100vh;display:grid;grid-template-columns:92px 1fr}.rail{border-right:1px solid #ffffff16;backdrop-filter:blur(20px);display:flex;align-items:center;flex-direction:column;padding:24px 12px;gap:16px}.brand{width:48px;height:48px;border:1px solid #78b7ff55;border-radius:16px;display:grid;place-items:center;font-weight:800;box-shadow:0 0 30px #4da3ff22}.main{padding:clamp(28px,5vw,72px)}.eyebrow{letter-spacing:.2em;text-transform:uppercase;color:#91a4bb;font-size:.72rem}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:42px}.hero h1{font-size:clamp(2.4rem,6vw,5.8rem);line-height:.92;margin:.25em 0 0;letter-spacing:-.055em;max-width:900px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.status,.language{border:1px solid #ffffff1d;background:#ffffff08;border-radius:999px;padding:10px 14px;font-size:.78rem;color:#b9c8db}.language select{background:transparent;color:#eef4ff;border:0;outline:0}.language option{color:#07101a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{border:1px solid #ffffff16;background:linear-gradient(145deg,#ffffff0d,#ffffff05);border-radius:24px;padding:22px;min-height:170px;box-shadow:inset 0 1px 0 #ffffff0a}.card strong{font-size:1.1rem}.meta{color:#8fa3ba;font-size:.8rem;margin-top:8px}.pill{display:inline-flex;margin-top:32px;border-radius:999px;padding:7px 10px;background:#76c5ff18;border:1px solid #76c5ff33;color:#a9dcff;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.footer{margin-top:42px;color:#63758a;font-size:.78rem}@media(max-width:700px){.shell{grid-template-columns:1fr}.rail{display:none}.hero{align-items:start;flex-direction:column}.main{padding:28px 20px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail"><div class="brand">A</div></aside>
    <main class="main">
      <div class="hero">
        <div><div class="eyebrow" id="eyebrow">Enterprise Operating System</div><h1 id="headline">ATLAS starts from a clean core.</h1></div>
        <div class="controls">
          <label class="language"><span id="language-label">Language</span> <select id="language" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select></label>
          <div class="status" id="system-status">Checking runtime…</div>
        </div>
      </div>
      <section class="grid" id="module-grid" aria-live="polite"></section>
      <div class="footer" id="footer">Clean rebuild · modular monorepo · production deployment pending runtime verification</div>
    </main>
  </div>
  <script>
    const copy={
      en:{eyebrow:'Enterprise Operating System',headline:'ATLAS starts from a clean core.',language:'Language',checking:'Checking runtime…',online:'Core online',offline:'Core unavailable',runtime:'Runtime unavailable',footer:'Clean rebuild · modular monorepo · production deployment pending runtime verification'},
      es:{eyebrow:'Sistema Operativo Empresarial',headline:'ATLAS comienza desde un núcleo limpio.',language:'Idioma',checking:'Verificando sistema…',online:'Núcleo en línea',offline:'Núcleo no disponible',runtime:'Sistema no disponible',footer:'Reconstrucción limpia · monorepo modular · despliegue de producción pendiente de verificación'}
    };
    const grid=document.querySelector('#module-grid');
    const statusEl=document.querySelector('#system-status');
    const language=document.querySelector('#language');
    const saved=localStorage.getItem('atlas.language');
    language.value=saved==='es'?'es':'en';
    let runtimeState='checking';
    let modules=[];
    const card=m=>`<article class="card"><strong>${m.name}</strong><div class="meta">${m.id} · v${m.version}</div><span class="pill">${m.status}</span></article>`;
    function render(){const locale=language.value==='es'?'es':'en';const t=copy[locale];document.documentElement.lang=locale;document.querySelector('#eyebrow').textContent=t.eyebrow;document.querySelector('#headline').textContent=t.headline;document.querySelector('#language-label').textContent=t.language;document.querySelector('#footer').textContent=t.footer;statusEl.textContent=runtimeState==='online'?t.online:runtimeState==='offline'?t.offline:runtimeState==='runtime'?t.runtime:t.checking;grid.innerHTML=modules.map(card).join('');localStorage.setItem('atlas.language',locale)}
    language.addEventListener('change',render);render();
    Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/modules').then(r=>r.json())]).then(([status,data])=>{runtimeState=status.ok?'online':'offline';modules=data.modules||[];render()}).catch(()=>{runtimeState='runtime';modules=[{name:'ATLAS Core',id:'core',version:'0.2.0',status:'unavailable'}];render()});
  </script>
</body>
</html>
