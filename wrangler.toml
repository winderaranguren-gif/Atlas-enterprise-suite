name = "atlas-enterprise-suite"
main = "src/index.js"
compatibility_date = "2026-08-11"
workers_dev = true

[[d1_databases]]
binding = "ATLAS_DB"
database_name = "REPLACE_WITH_ATLAS_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_ATLAS_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATLAS_BACKUPS"
bucket_name = "REPLACE_WITH_ATLAS_BACKUPS_BUCKET_NAME"

[vars]
ATLAS_ENV = "production"
ATLAS_DEFAULT_LOCALE = "en"
