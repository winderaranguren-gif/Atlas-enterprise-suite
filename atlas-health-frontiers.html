<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS Health Frontiers</title>
<style>
:root{--bg:#06111c;--panel:#0c1d2b;--panel2:#10283a;--line:#23465b;--text:#eaf7ff;--muted:#91afbf;--accent:#42d9ff;--ok:#68e0a0;--warn:#ffd166;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 0,#12374d 0,transparent 35%),var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px;background:rgba(5,16,26,.92);position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:800;letter-spacing:.08em}.brand small{display:block;color:var(--accent);font-size:11px;margin-top:5px}.nav{display:grid;gap:8px;margin-top:26px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:12px;text-align:left;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#087eaa,#16b9d8);border:0}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(145deg,rgba(16,40,58,.95),rgba(8,24,36,.96));border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.kpi strong{font-size:30px;display:block;margin-top:8px}.muted{color:var(--muted)}.two{grid-template-columns:1.1fr .9fr}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{background:#071724;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;width:100%}textarea{min-height:100px}.toolbar input{max-width:420px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.pill{display:inline-block;padding:5px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px}.approved{color:var(--ok)}.experimental{color:var(--warn)}.hypothesis{color:var(--accent)}.hidden{display:none!important}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{margin:0}.result-box{white-space:pre-wrap;line-height:1.55;background:#071724;border:1px solid var(--line);padding:14px;border-radius:12px}.disclaimer{border-left:4px solid var(--warn);padding:12px 14px;background:rgba(255,209,102,.08);color:#f7e7b8;border-radius:8px}.bars div{margin:12px 0}.bar{height:9px;background:#071724;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#0b8db4,#4ee1ff)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.kpis,.two,.form-grid{grid-template-columns:1fr}.main{padding:15px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">ATLAS<small>HEALTH FRONTIERS</small></div><div class="nav" id="nav"></div><hr style="border-color:var(--line);margin:24px 0"><a class="btn" href="index.html" style="display:block;text-decoration:none;text-align:center">← ATLAS Enterprise</a></aside><main class="main"><header class="top"><div><h1 id="title">Command Center</h1><p id="subtitle">Disease intelligence, research gaps and laboratory analytics.</p></div><button class="btn primary" id="exportBtn">Exportar respaldo JSON</button></header><div id="view"></div></main></div>
<script>
(()=>{'use strict';
const KEY='atlas-health-frontiers-v1';
const seed=[
{id:'cyclospora',name:'Ciclosporiasis',category:'Infecciosa',mechanism:'Infección intestinal por Cyclospora cayetanensis.',current:'TMP-SMX es el tratamiento estándar cuando está indicado clínicamente.',gaps:'Biología incompleta, alternativas limitadas para alergia a sulfas, ausencia de vacuna.',hypothesis:'Priorizar blancos metabólicos exclusivos, reposicionamiento y antígenos de invasión.',evidence:'Tratamiento aprobado / hipótesis de investigación',status:'Research-ready'},
{id:'cancer',name:'Cáncer — marco multitumoral',category:'Oncología',mechanism:'Crecimiento celular desregulado con mecanismos variables por tumor.',current:'Cirugía, radioterapia, terapias sistémicas e inmunoterapia según tipo y etapa.',gaps:'Resistencia, heterogeneidad, recaída, toxicidad y detección tardía.',hypothesis:'Modelos por subtipo, biomarcadores longitudinales y combinaciones adaptativas.',evidence:'Variable por indicación',status:'Active research'},
{id:'unknown',name:'Síndrome emergente ATLAS-0001',category:'Emergente',mechanism:'No confirmado. Registro para patrones clínicos no clasificados.',current:'Sin tratamiento específico; requiere evaluación profesional y vigilancia sanitaria.',gaps:'Causa, definición de caso, biomarcadores, transmisibilidad y evolución.',hypothesis:'Agrupamiento sindrómico con revisión epidemiológica humana.',evidence:'No confirmado',status:'Watchlist'}];
const initial={diseases:seed,dossiers:[],lab:[],audit:[{time:new Date().toISOString(),action:'Module initialized'}]};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial}catch{state=initial}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=[['dashboard','Command Center'],['diseases','Disease Universe'],['research','Research Gap Engine'],['dossiers','Scientific Dossiers'],['lab','ATLAS Lab Intelligence'],['quality','Evidence & Safety'],['audit','Audit Trail']];let page='dashboard';
function nav(){document.querySelector('#nav').innerHTML=pages.map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'active':''}">${x[1]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function dashboard(){return `<div class="grid kpis">${[['Diseases',state.diseases.length],['Research dossiers',state.dossiers.length],['Lab observations',state.lab.length],['Audit events',state.audit.length]].map(x=>`<div class="card kpi"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="grid two" style="margin-top:16px"><section class="card"><div class="section-title"><h2>Research readiness</h2></div><div class="bars"><div>Knowledge bank<div class="bar"><span style="width:88%"></span></div></div><div>Gap mapping<div class="bar"><span style="width:76%"></span></div></div><div>Experimental planning<div class="bar"><span style="width:64%"></span></div></div><div>Clinical deployment<div class="bar"><span style="width:20%"></span></div></div></div></section><section class="card"><h2>Operating boundary</h2><p class="disclaimer">ATLAS organizes evidence and research hypotheses. It does not replace diagnosis, laboratory validation, ethics review, regulatory authorization or licensed clinical judgment.</p><p class="muted">Every candidate must retain evidence level, uncertainty, risks, validation requirements and human approval.</p></section></div>`}
function diseases(){return `<section class="card"><div class="section-title"><h2>Disease Universe</h2><button class="btn primary" id="addDisease">＋ Nueva ficha</button></div><div class="toolbar"><input id="search" placeholder="Buscar enfermedad, categoría o vacío científico"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Enfermedad</th><th>Categoría</th><th>Vacío principal</th><th>Estado</th><th></th></tr></thead><tbody id="diseaseRows">${diseaseRows(state.diseases)}</tbody></table></div></section>`}
function diseaseRows(rows){return rows.map(d=>`<tr><td><strong>${esc(d.name)}</strong><br><span class="muted">${esc(d.mechanism)}</span></td><td>${esc(d.category)}</td><td>${esc(d.gaps)}</td><td><span class="pill hypothesis">${esc(d.status)}</span></td><td><button class="btn" data-dossier="${d.id}">Crear dossier</button></td></tr>`).join('')}
function research(){return `<div class="grid two"><section class="card"><h2>Research Gap Engine</h2><p class="muted">Convierte una necesidad no resuelta en una hipótesis verificable.</p><div class="form-grid"><label>Enfermedad<select id="rDisease">${state.diseases.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></label><label>Prioridad<select id="priority"><option>Alta</option><option>Media</option><option>Exploratoria</option></select></label><label class="full">Pregunta científica<textarea id="question" placeholder="¿Qué mecanismo, biomarcador o intervención debe estudiarse?"></textarea></label><label class="full">Hipótesis propuesta<textarea id="hypothesis"></textarea></label><button class="btn primary full" id="generatePlan">Generar plan científico</button></div></section><section class="card"><h2>Scientific test pathway</h2><div id="plan" class="result-box">Selecciona una enfermedad y crea una hipótesis. ATLAS generará objetivos, controles, criterios de éxito, riesgos y ruta regulatoria.</div></section></div>`}
function dossiers(){return `<section class="card"><div class="section-title"><h2>Scientific Dossiers</h2><button class="btn" id="exportDossiers">Exportar CSV</button></div>${state.dossiers.length?state.dossiers.map((d,i)=>`<article style="border-top:1px solid var(--line);padding:16px 0"><strong>${esc(d.disease)}</strong> · <span class="pill experimental">${esc(d.priority)}</span><p>${esc(d.question)}</p><details><summary>Ver expediente</summary><div class="result-box">${esc(d.plan)}</div></details><button class="btn" data-delete-dossier="${i}">Eliminar</button></article>`).join(''):'<p class="muted">No hay expedientes todavía.</p>'}</section>`}
function lab(){return `<div class="grid two"><section class="card"><h2>ATLAS Lab Intelligence</h2><p class="disclaimer">Demo educativa. No emite diagnósticos ni sustituye un laboratorio certificado.</p><div class="form-grid"><label>Prueba<input id="test" placeholder="Ej. Hemoglobina"></label><label>Tipo de muestra<select id="specimen"><option>Sangre</option><option>Orina</option><option>Heces</option><option>Saliva</option><option>Otro</option></select></label><label>Resultado<input id="value" type="number" step="any"></label><label>Unidad<input id="unit" placeholder="g/dL"></label><label>Referencia mínima<input id="low" type="number" step="any"></label><label>Referencia máxima<input id="high" type="number" step="any"></label><label class="full">Contexto clínico opcional<textarea id="context" placeholder="Ayuno, medicamentos, hora, síntomas, condiciones conocidas..."></textarea></label><button class="btn primary full" id="analyzeLab">Analizar observación</button></div></section><section class="card"><h2>Interpretación estructurada</h2><div id="labResult" class="result-box">Ingrese una observación con su intervalo de referencia.</div></section></div><section class="card" style="margin-top:16px"><h2>Historial local</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Fecha</th><th>Prueba</th><th>Muestra</th><th>Resultado</th><th>Bandera</th></tr></thead><tbody>${state.lab.map(x=>`<tr><td>${new Date(x.time).toLocaleString()}</td><td>${esc(x.test)}</td><td>${esc(x.specimen)}</td><td>${esc(x.value)} ${esc(x.unit)}</td><td>${esc(x.flag)}</td></tr>`).join('')}</tbody></table></div></section>`}
function quality(){return `<div class="grid two"><section class="card"><h2>Evidence classification</h2><table class="table"><tr><td class="approved">Aprobado</td><td>Autorizado para una indicación concreta.</td></tr><tr><td class="experimental">Clinical research</td><td>En evaluación formal; no equivale a aprobación.</td></tr><tr><td class="hypothesis">Preclinical / hypothesis</td><td>Requiere validación antes de uso humano.</td></tr></table></section><section class="card"><h2>Mandatory controls</h2><p>Provenance · versioning · human review · uncertainty · bias checks · privacy · cybersecurity · laboratory quality · adverse-event reporting.</p></section></div>`}
function audit(){return `<section class="card"><h2>Audit Trail</h2>${state.audit.map(a=>`<p><strong>${new Date(a.time).toLocaleString()}</strong> — ${esc(a.action)}</p>`).join('')}</section>`}
function render(){nav();const map={dashboard,diseases,research,dossiers,lab,quality,audit};document.querySelector('#title').textContent=pages.find(x=>x[0]===page)[1];document.querySelector('#view').innerHTML=map[page]();bind()}
function bind(){const s=document.querySelector('#search');if(s)s.oninput=()=>{const q=s.value.toLowerCase();document.querySelector('#diseaseRows').innerHTML=diseaseRows(state.diseases.filter(d=>JSON.stringify(d).toLowerCase().includes(q)));bind()};document.querySelectorAll('[data-dossier]').forEach(b=>b.onclick=()=>{const d=state.diseases.find(x=>x.id===b.dataset.dossier);state.dossiers.unshift(makeDossier(d,'Alta',`Investigar una intervención que resuelva: ${d.gaps}`,d.hypothesis));log(`Dossier created: ${d.name}`);page='dossiers';render()});
const add=document.querySelector('#addDisease');if(add)add.onclick=()=>{const name=prompt('Nombre de la enfermedad o síndrome');if(!name)return;const category=prompt('Categoría')||'Sin clasificar';const gaps=prompt('Vacío científico principal')||'Pendiente de revisión';state.diseases.unshift({id:crypto.randomUUID(),name,category,mechanism:'Pendiente de revisión científica.',current:'Pendiente de revisión.',gaps,hypothesis:'Pendiente de formulación.',evidence:'Sin clasificar',status:'Draft'});log(`Disease record added: ${name}`);render()};
const gen=document.querySelector('#generatePlan');if(gen)gen.onclick=()=>{const d=state.diseases.find(x=>x.id===document.querySelector('#rDisease').value),q=document.querySelector('#question').value.trim()||`Resolver el vacío: ${d.gaps}`,h=document.querySelector('#hypothesis').value.trim()||d.hypothesis,p=document.querySelector('#priority').value,obj=makeDossier(d,p,q,h);document.querySelector('#plan').textContent=obj.plan;state.dossiers.unshift(obj);log(`Research plan generated: ${d.name}`);save()};
const analyze=document.querySelector('#analyzeLab');if(analyze)analyze.onclick=()=>{const value=+document.querySelector('#value').value,low=+document.querySelector('#low').value,high=+document.querySelector('#high').value;if(!Number.isFinite(value)||!Number.isFinite(low)||!Number.isFinite(high)||low>=high){alert('Ingrese resultado y límites válidos.');return}const flag=value<low?'BAJO':value>high?'ALTO':'DENTRO DEL INTERVALO';const x={time:new Date().toISOString(),test:document.querySelector('#test').value||'Prueba sin nombre',specimen:document.querySelector('#specimen').value,value,unit:document.querySelector('#unit').value,low,high,flag,context:document.querySelector('#context').value};state.lab.unshift(x);log(`Lab observation analyzed: ${x.test}`);document.querySelector('#labResult').textContent=`Resultado: ${value} ${x.unit}\nIntervalo suministrado: ${low}–${high} ${x.unit}\nBandera técnica: ${flag}\n\nInterpretación segura: este resultado debe revisarse considerando método, laboratorio, edad, contexto, medicamentos, preparación y tendencia histórica. Una bandera aislada no establece un diagnóstico. Consulte al profesional que ordenó la prueba; los valores críticos requieren el protocolo del laboratorio.`;save()};
document.querySelectorAll('[data-delete-dossier]').forEach(b=>b.onclick=()=>{state.dossiers.splice(+b.dataset.deleteDossier,1);log('Dossier deleted');render()});const ex=document.querySelector('#exportDossiers');if(ex)ex.onclick=()=>download('atlas-health-dossiers.csv','disease,priority,question,created\n'+state.dossiers.map(d=>[d.disease,d.priority,d.question,d.created].map(csv).join(',')).join('\n'),'text/csv')}
function makeDossier(d,priority,question,hypothesis){return{disease:d.name,priority,question,created:new Date().toISOString(),plan:`ATLAS HEALTH FRONTIERS — SCIENTIFIC RESEARCH DOSSIER\n\nDisease: ${d.name}\nCategory: ${d.category}\nKnown mechanism: ${d.mechanism}\nCurrent standard: ${d.current}\nKnowledge gap: ${d.gaps}\nResearch question: ${question}\nHypothesis: ${hypothesis}\nEvidence status: ${d.evidence}\n\nTEST PATHWAY\n1. Systematic evidence review and contradiction map.\n2. Define target, endpoint, comparator and falsifiable prediction.\n3. Computational validation and off-target/toxicity assessment.\n4. Controlled biochemical and cellular studies with positive, negative and vehicle controls.\n5. Independent replication and predefined success/failure thresholds.\n6. Preclinical pharmacology, safety, manufacturing and quality work when applicable.\n7. Ethics and regulatory review before any human participation.\n8. Phase I safety, Phase II preliminary efficacy, Phase III confirmation, then regulatory evaluation.\n9. Post-approval pharmacovigilance if authorized.\n\nREQUIRED SAFEGUARDS\nNo direct patient use from a computational prediction. Record uncertainty, adverse possibilities, failed experiments, conflicts and data provenance.`}}
function log(action){state.audit.unshift({time:new Date().toISOString(),action});save()}function csv(x){return '"'+String(x??'').replaceAll('"','""')+'"'}function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#exportBtn').onclick=()=>download('atlas-health-frontiers-backup.json',JSON.stringify(state,null,2));render();
})();
</script></body></html>
