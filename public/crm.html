<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914"><title>ATLAS CRM</title><link rel="stylesheet" href="/marketing.css"><style>body{background:#050914;color:#eef6ff}.crm-shell{max-width:1180px;margin:auto;padding:28px 18px 80px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{padding:10px 14px;border-radius:12px;border:1px solid #20385a;background:#101d31;color:#eef6ff;cursor:pointer}.tab.active,.btn.primary{background:linear-gradient(135deg,#47c7ff,#5f78ff);border:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.card{background:#0d1728;border:1px solid #20385a;border-radius:18px;padding:16px}.muted{color:#8fa5bc}.status{margin-top:12px;padding:12px;border-radius:14px;background:#0b1524;border:1px solid #20385a}.ok{color:#47d18c}.bad{color:#ff6f88}.list{display:grid;gap:10px;margin-top:14px}.item{padding:12px;border-radius:14px;background:#0b1524;border:1px solid #1d3350}.row{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr;gap:10px;align-items:center}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stage{min-height:200px;padding:12px;border-radius:16px;background:#0b1524;border:1px solid #20385a}.stage h3{font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}select,input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #20385a;background:#08111f;color:#eef6ff}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><script src="/language-core.js" defer></script><main class="crm-shell"><div class="top"><div><div class="muted">ATLAS Enterprise Suite</div><h1>CRM</h1></div><a class="btn" href="/app.html">← ATLAS</a></div><div class="toolbar"><div class="tabs"><button class="tab active" data-view="overview">Overview</button><button class="tab" data-view="accounts">Accounts</button><button class="tab" data-view="contacts">Contacts</button><button class="tab" data-view="leads">Leads</button><button class="tab" data-view="pipeline">Opportunities</button><button class="tab" data-view="tasks">Tasks</button><button class="tab" data-view="activity">Activity</button></div><select id="companySelect" style="max-width:280px"><option>Current company / DBA</option></select></div><div id="crmStatus" class="status">Checking ATLAS CRM service…</div><section id="view" style="margin-top:16px"></section></main><script>
const $=s=>document.querySelector(s);let apiReady=false;let data={accounts:[],contacts:[],leads:[],opportunities:[],tasks:[],activity:[]};
async function req(path,opts={}){const token=localStorage.getItem('atlas.auth.token');opts.headers={...(opts.headers||{}),'content-type':'application/json'};if(token)opts.headers.authorization='Bearer '+token;const r=await fetch(path,opts);let body;try{body=await r.json()}catch{body={}};if(!r.ok)throw new Error(body.error||('HTTP '+r.status));return body}
async function check(){try{const h=await req('/api/crm/health');apiReady=!!h.operational;$('#crmStatus').innerHTML=apiReady?'<span class="ok">CRM OPERATIVE</span> · persistent service connected':'<span class="bad">CRM NOT OPERATIVE</span> · service not provisioned';if(apiReady)await loadAll()}catch(e){apiReady=false;$('#crmStatus').innerHTML='<span class="bad">CRM NOT OPERATIVE</span> · '+e.message}render('overview')}
async function loadAll(){for(const k of Object.keys(data)){try{const r=await req('/api/crm/'+k);data[k]=r[k]||[]}catch{data[k]=[]}}}
function metric(label,value){return `<div class="card"><div class="muted">${label}</div><div style="font-size:32px;font-weight:800;margin-top:6px">${value}</div></div>`}
function render(view){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const root=$('#view');if(!apiReady){root.innerHTML='<div class="card"><h2>CRM service is blocked</h2><p class="muted">ATLAS will not simulate customer data. Provision the real CRM API, database tables, organization/DBA scoping, permissions and audit log. This screen will become operational automatically when /api/crm/health returns operational=true.</p></div>';return}if(view==='overview'){root.innerHTML=`<div class="grid">${metric('Accounts',data.accounts.length)}${metric('Contacts',data.contacts.length)}${metric('Leads',data.leads.length)}${metric('Open opportunities',data.opportunities.filter(x=>x.status!=='won'&&x.status!=='lost').length)}</div><div class="card" style="margin-top:14px"><h2>CRM flow</h2><p class="muted">Account → Contact → Lead → Opportunity → Quote → Customer → Invoice / Documents / Activity</p></div>`;return}if(view==='pipeline'){const stages=['new','qualified','proposal','negotiation','won'];root.innerHTML='<div class="pipeline">'+stages.map(s=>`<div class="stage"><h3>${s.toUpperCase()}</h3>${data.opportunities.filter(o=>(o.stage||'new')===s).map(o=>`<div class="item"><strong>${o.name||'Opportunity'}</strong><div class="muted">${o.amount||''}</div></div>`).join('')}</div>`).join('')+'</div>';return}const key=view==='accounts'?'accounts':view==='contacts'?'contacts':view==='leads'?'leads':view==='tasks'?'tasks':'activity';root.innerHTML=`<div class="card"><div class="toolbar"><h2>${key[0].toUpperCase()+key.slice(1)}</h2><button class="btn primary" onclick="createItem('${key}')">+ New</button></div><div class="list">${data[key].map(x=>`<div class="item row"><strong>${x.name||x.title||x.subject||x.email||'Record'}</strong><span>${x.email||x.company||x.status||''}</span><span>${x.owner||x.stage||''}</span><span>${x.updated_at||''}</span></div>`).join('')||'<div class="muted">No records yet.</div>'}</div></div>`}
async function createItem(type){if(!apiReady)return;const name=prompt('Name / title');if(!name)return;try{await req('/api/crm/'+type,{method:'POST',body:JSON.stringify({name})});await loadAll();render(type==='opportunities'?'pipeline':type)}catch(e){alert(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.view));check();
</script></body></html>
