<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050914" />
  <meta name="description" content="ATLAS Enterprise Suite" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/core-services.css" />
  <link rel="stylesheet" href="/surface-mode.css" />
  <link rel="stylesheet" href="/universal-access.css" />
  <title>ATLAS Enterprise Suite</title>
</head>
<body>
  <div class="sky-stage" aria-hidden="true"></div>
  <div class="app-frame">
    <header class="topbar">
      <div class="brand"><span class="mark">A</span><div><strong>ATLAS</strong><small>Enterprise Suite</small></div></div>
      <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search ATLAS…" autocomplete="off" /></label>
      <div class="top-actions">
        <button class="top-icon" title="Universal Access" aria-label="Open ATLAS Universal Access" onclick="window.ATLASUniversalAccess?.open()">◌</button>
        <button class="top-icon" title="Screens" aria-label="Open ATLAS Multi-Pane Workspace">▣</button>
        <button class="top-icon" title="Calendar">▦</button>
        <button class="top-icon" title="Notifications">◔</button>
        <div class="profile"><span class="avatar">E</span><div><strong id="profileName">Esther</strong><small>Admin</small></div></div>
      </div>
    </header>

    <div class="app-layout">
      <aside class="rail" aria-label="Main navigation">
        <nav class="rail-nav">
          <button class="nav active" data-view="home"><span>◉</span>Command Center</button>
          <button class="nav" data-operational="status"><span>✓</span>Operational Core</button>
          <button class="nav" data-operational="pages"><span>▧</span>Pages</button>
          <button class="nav" data-operational="backups"><span>⇧</span>Backups</button>
          <button class="nav" onclick="location.href='/crm.html'"><span>◎</span>CRM</button>
          <button class="nav" data-view="repertoire"><span>⌘</span>Repertoire</button>
          <button class="nav" data-view="modules"><span>▦</span>Enterprise</button>
          <button class="nav" data-view="people"><span>◎</span>People</button>
          <button class="nav" data-view="mobility"><span>⌁</span>Mobility</button>
          <button class="nav" data-view="health"><span>♡</span>Health</button>
          <button class="nav" onclick="location.href='/music-prompter.html'"><span>♫</span>Music Prompter</button>
          <button class="nav" data-view="music"><span>◇</span>Media</button>
          <button class="nav" data-view="research"><span>∞</span>Research</button>
          <button class="nav" data-view="finance"><span>▤</span>Finance</button>
          <button class="nav" data-view="services"><span>◈</span>Core Services</button>
          <button class="nav" data-view="settings"><span>⚙</span>Settings</button>
        </nav>
        <div class="rail-status">
          <div><span class="status-dot"></span><strong>ATLAS OS</strong></div>
          <small>v1.4.4</small><span class="healthy">Updated</span>
        </div>
        <div class="rail-status update-card">
          <div><span class="status-dot"></span><strong>Update Fabric</strong></div>
          <small>AUTO-UPDATE</small><span class="healthy">Active</span>
        </div>
      </aside>

      <main id="mainView" class="workspace" tabindex="-1"></main>
    </div>

    <footer class="market-strip">
      <span class="live-chip">✦ LIVE</span>
      <span>ATLAS Secure Network</span>
      <span>Update Fabric: active</span>
      <span>Web + App surface</span>
      <span id="footerClock"></span>
    </footer>
  </div>

  <script src="/language-core.js" defer></script>
  <script src="/core-services.js" defer></script>
  <script src="/music-core.js" defer></script>
  <script src="/update-core.js" defer></script>
  <script src="/repertoire-ui.js" defer></script>
  <script src="/surface-mode.js" defer></script>
  <script src="/operational-ui.js" defer></script>
  <script src="/universal-access.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/operational-routing.js" defer></script>
  <script src="/review-mode.js" defer></script>
  <script src="/multipane.js" defer></script>
</body>
</html>
