<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS</title></head>
<body>
<main><h1>ATLAS</h1><p>Production deployment baseline</p><label>Language <select id="language"><option value="en">English</option><option value="es">Español</option></select></label></main>
<script>
const language=document.getElementById('language');
const saved=localStorage.getItem('atlas.language');
language.value=saved==='es'?'es':'en';
document.documentElement.lang=language.value;
language.addEventListener('change',()=>{localStorage.setItem('atlas.language',language.value);document.documentElement.lang=language.value;});
</script>
</body></html>
