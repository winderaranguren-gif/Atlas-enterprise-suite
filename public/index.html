<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="ATLAS Enterprise Suite" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <title>ATLAS Enterprise Suite</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand"><span class="mark">A</span><div><strong>ATLAS</strong><small>Enterprise Suite</small></div></div>
    <div class="status"><span class="pulse"></span> Core online <span id="clock"></span></div>
  </header>
  <main class="shell">
    <aside class="rail">
      <button class="nav active" data-view="home">Command Center</button>
      <button class="nav" data-view="modules">Module Center</button>
      <button class="nav" data-view="regions">Regional Layer</button>
      <button class="nav" data-view="support">Technical Support</button>
      <button class="nav" data-view="settings">Settings</button>
    </aside>
    <section class="workspace">
      <div class="hero">
        <div><p class="eyebrow">ATLAS GLOBAL CORE</p><h1 id="viewTitle">Command Center</h1><p id="viewSubtitle">A clean, resilient operating surface for the ATLAS ecosystem.</p></div>
        <div class="region-control"><label for="region">Region</label><select id="region"></select></div>
      </div>
      <section id="content" class="grid"></section>
    </section>
  </main>
  <footer>ATLAS Health Frontiers · <a href="mailto:atlashealthfrontiers@gmail.com">atlashealthfrontiers@gmail.com</a> · v1.0.0</footer>
  <script src="/app.js" defer></script>
</body>
</html>
