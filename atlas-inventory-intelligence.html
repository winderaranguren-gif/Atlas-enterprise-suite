aid</button></td></tr>`).join('')}</tbody></table></article>`}function reports(){let cnt=s.events.reduce((q,x)=>q+x.counted,0),rev=s.invoices.reduce((q,x)=>q+x.amount,0);return `<div class='toolbar'><button class='btn' onclick='print()'>Print / PDF</button><button class='btn' data-json>Full backup</button></div><section class='report'><div class='eye'>ATLAS INVENTORY INTELLIGENCE</div><h1>Executive Operations Report</h1><p class='muted'>Generated ${d()}</p><div class='grid kpis'>${kp('Events',s.events.length,'All statuses')}${kp('Units counted',n(cnt),'Recorded')}${kp('Revenue',m(rev),'Service invoices')}${kp('Open variances',s.variances.filter(v=>v.status==='review').length,'Review queue')}</div><table><thead><tr><th>Event</th><th>Client</th><th>Progress</th><th>Accuracy</th><th>Price</th></tr></thead><tbody>${s.events.map(x=>`<tr><td>${x.number}</td><td>${e(cl(x.clientId)?.name)}</td><td>${Math.round(x.counted/x.expected*100)}%</td><td>${x.accuracy}%</td><td>${m(x.price)}</td></tr>`).join('')}</tbody></table><p><b>Control note:</b> CRUD, scans, variances, billing, exports and audit work locally. External POS/ERP, RFID, camera vision and payroll require production credentials and hardware connectors.</p></section>`}function integrations(){let info={pos:'Point-of-sale stock movements',accounting:'ATLAS Accounting adjustments',payroll:'Field payroll data',erp:'ERP/WMS item master',rfid:'RFID reader gateway',vision:'Vision Count AI'};return `<section class='hero'><div class='eye'>CONNECTED OPERATIONS</div><h1>Integration Center</h1><p>These switches persist configuration. Production exchange requires credentials, endpoints or supported hardware.</p></section><div class='cards'>${Object.entries(info).map(([k,v])=>`<article class='card item'><div class='row'><h3>${k.toUpperCase()}</h3><button class='toggle ${s.integrations[k]?'on':''}' data-int='${k}'></button></div><p class='muted'>${v}</p>${st(s.integrations[k]?'active':'pending')}</article>`).join('')}</div>`}function activity(l=100){return `<div class='activity'>${s.audit.slice(0,l).map(a=>`<div><b>${e(a.a)}</b><small>${e(a.x)} · ${new Date(a.t).toLocaleString()}</small></div>`).join('')}</div>`}function settings(){return `<div class='grid two'><article class='card pad'><h3>Data control</h3><p class='muted'>Export all operational data or restore the demo workspace.</p><div class='actions'><button class='btn' data-json>Export JSON</button><button id='reset' class='btn danger'>Reset demo</button></div></article><article class='card pad'><h3>Deployment status</h3><p><b>Operational:</b> menus, events, scan entry, variances, clients, workforce, projects, billing, reports and audit.</p><p><b>Requires connector:</b> RFID, camera vision, ERP/POS posting and cloud multi-user access.</p></article></div>`}function render(){nav();let P={dashboard:dash,events,scan,variances,locations:()=>cards('locations'),clients:()=>cards('clients'),workforce:()=>cards('workers'),projects:()=>cards('projects'),billing,reports,integrations,audit:()=>`<article class='card'><div class='head'><h3>Audit trail</h3></div>${activity()}</article>`,settings};$('#content').innerHTML=(P[s.page]||dash)();bind()}function add(t){if(t==='event'){let number=prompt('Event number',`EVT-${d().replaceAll('-','')}-${s.events.length+1}`);if(!number)return;let loc=s.locations[0];s.events.unshift({id:id(),number,clientId:loc.clientId,locationId:loc.id,date:d(),mode:'FullCount',status:'scheduled',expected:+prompt('Expected units','1000')||0,counted:0,accuracy:0,price:+prompt('Service price','1500')||0})}else if(t==='client'){let name=prompt('Client name');if(name)s.clients.unshift({id:id(),name,industry:prompt('Industry','Retail')||'',contact:prompt('Contact','')||'',status:'active'})}else if(t==='location'){let name=prompt('Location name');if(name)s.locations.unshift({id:id(),clientId:s.clients[0]?.id,name,type:prompt('Type','Retail')||'',zones:+prompt('Zones','6')||0,progress:0,status:'scheduled'})}else if(t==='worker'){let name=prompt('Worker name');if(name)s.workers.unshift({id:id(),name,role:prompt('Role','Inventory Associate')||'',cert:prompt('Certification','Retail')||'',rate:+prompt('Hourly rate','18')||0,status:'active',score:100})}else if(t==='project'){let name=prompt('Project name');if(name)s.projects.unshift({id:id(),clientId:s.clients[0]?.id,name,type:prompt('Type','Planogram')||'',progress:0,status:'scheduled',budget:+prompt('Budget','2500')||0})}else if(t==='invoice'){let number=prompt('Invoice number',`INV-II-${1000+s.invoices.length+1}`);if(number)s.invoices.unshift({id:id(),number,clientId:s.clients[0]?.id,eventId:s.events[0]?.id,amount:+prompt('Amount','1500')||0,status:'open'})}log(`${t}.create`,t);render();toast('Saved',t)}function csv(k){let a=s[k];if(!a?.length)return;let cols=[...new Set(a.flatMap(Object.keys))],txt=[cols.join(','),...a.map(r=>cols.map(c=>`"${String(r[c]??'').replaceAll('"','""')}"`).join(','))].join('\n');dl(`atlas-${k}-${d()}.csv`,txt,'text/csv')}function dl(name,txt,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}function bind(){$$('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$$('[data-filter]').forEach(i=>i.oninput=()=>$$('[data-search]').forEach(r=>r.hidden=!r.dataset.search.toLowerCase().includes(i.value.toLowerCase())));$$('[data-csv]').forEach(b=>b.onclick=()=>csv(b.dataset.csv));$$('[data-open]').forEach(b=>b.onclick=()=>{s.scanEvent=b.dataset.open;s.page='scan';save();render()});$$('[data-complete]').forEach(b=>b.onclick=()=>{let x=ev(b.dataset.complete);x.status='completed';x.counted=x.expected;x.accuracy=x.accuracy||99;let l=lo(x.locationId);if(l){l.progress=100;l.status='completed'}log('event.completed',x.number);render()});$$('[data-var]').forEach(b=>b.onclick=()=>{let v=s.variances.find(x=>x.id===b.dataset.id);v.status=b.dataset.var;log('variance.update',v.sku);render()});$$('[data-paid]').forEach(b=>b.onclick=()=>{let i=s.invoices.find(x=>x.id===b.dataset.paid);i.status='paid';log('invoice.paid',i.number);render()});$$('[data-int]').forEach(b=>b.onclick=()=>{let k=b.dataset.int;s.integrations[k]=!s.integrations[k];log('integration.toggle',k);render()});$$('[data-json]').forEach(b=>b.onclick=()=>dl(`atlas-inventory-${d()}.json`,JSON.stringify(s,null,2),'application/json'));if($('#scanEvent'))$('#scanEvent').onchange=x=>{s.scanEvent=x.target.value;save();render()};if($('#scanForm'))$('#scanForm').onsubmit=x=>{x.preventDefault();let f=new FormData(x.target),code=f.get('code'),p=s.products.find(p=>p.barcode===code||p.sku.toLowerCase()===String(code).toLowerCase())||{barcode:code,sku:code,name:'Unmapped item',expected:0,cost:0},qty=+f.get('qty'),eventId=f.get('eventId');s.counts.push({id:id(),eventId,sku:p.sku,name:p.name,zone:f.get('zone'),qty,user:f.get('user'),t:new Date().toISOString()});let E=ev(eventId);E.status='in_progress';E.counted+=qty;let total=s.counts.filter(c=>c.eventId===eventId&&c.sku===p.sku).reduce((q,c)=>q+c.qty,0),v=s.variances.find(v=>v.eventId===eventId&&v.sku===p.sku);if(total!==p.expected){if(v){v.counted=total;v.status='review'}else s.variances.unshift({id:id(),eventId,sku:p.sku,name:p.name,expected:p.expected,counted:total,cost:p.cost,status:'review'})}log('count.recorded',`${p.sku} · ${qty}`);render();toast('Count recorded',p.name)};if($('#reset'))$('#reset').onclick=()=>{if(confirm('Reset demo data?')){s=seed();save();render()}}}$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#newEvent').onclick=()=>add('event');$('#backup').onclick=()=>dl(`atlas-inventory-${d()}.json`,JSON.stringify(s,null,2),'application/json');render()})();</script></body></html>
