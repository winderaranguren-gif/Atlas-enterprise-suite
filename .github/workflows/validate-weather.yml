name: Validate ATLAS Weather

on:
  pull_request:
    paths:
      - 'modules/weather-worker.js'
      - 'atlas-router.js'
      - 'scripts/validate-weather.mjs'
      - 'package.json'
      - '.github/workflows/validate-weather.yml'
  push:
    branches: [main]
    paths:
      - 'modules/weather-worker.js'
      - 'atlas-router.js'
      - 'scripts/validate-weather.mjs'
      - 'package.json'
      - '.github/workflows/validate-weather.yml'

permissions:
  contents: read

jobs:
  validate-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:weather
