name: ATLAS Wallet Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/wallet-worker.js'
      - 'modules/wallet-identity-gate.js'
      - 'modules/wallet-request-security.js'
      - 'rideos-router.js'
      - 'wrangler.jsonc'
      - 'scripts/validate-wallet.mjs'
      - 'scripts/wallet-store-behavior.mjs'
      - 'package.json'
      - '.github/workflows/validate-wallet.yml'
  push:
    branches: [main]
    paths:
      - 'modules/wallet-worker.js'
      - 'modules/wallet-identity-gate.js'
      - 'modules/wallet-request-security.js'
      - 'rideos-router.js'
      - 'wrangler.jsonc'
      - 'scripts/validate-wallet.mjs'
      - 'scripts/wallet-store-behavior.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:wallet
      - run: node scripts/wallet-store-behavior.mjs
