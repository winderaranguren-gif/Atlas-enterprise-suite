name: ATLAS Backup v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches: [main]
    paths:
      - 'atlas-sovereign-vault/**'
      - 'scripts/atlas-backup.sh'
      - 'scripts/atlas-verify.sh'
      - '.github/workflows/atlas-backup-v2.yml'

permissions:
  contents: read

concurrency:
  group: atlas-backup-v2
  cancel-in-progress: false

jobs:
  runner-probe:
    name: Backup Runner Probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm runner can execute steps
        run: echo "ATLAS backup runner probe passed"

  backup-and-verify:
    name: Build and Verify Backup
    needs: runner-probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify backup tools exist
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/atlas-backup.sh
          test -f scripts/atlas-verify.sh
          chmod +x scripts/atlas-backup.sh scripts/atlas-verify.sh

      - name: Build sovereign snapshot
        shell: bash
        run: scripts/atlas-backup.sh .

      - name: Verify latest snapshot integrity
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(ls -1t .atlas-backups/atlas-backup-*.tar.gz | head -n1)"
          scripts/atlas-verify.sh "$ARCHIVE" "${ARCHIVE}.sha256"
          echo "ATLAS backup integrity verified"

      - name: Publish backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-sovereign-backup-${{ github.run_id }}
          path: |
            .atlas-backups/*.tar.gz
            .atlas-backups/*.sha256
          if-no-files-found: error
          retention-days: 90
