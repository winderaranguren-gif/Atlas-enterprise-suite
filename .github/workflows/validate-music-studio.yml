name: Validate ATLAS Music Studio

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/music-studio-worker.js'
      - 'scripts/validate-music-studio.mjs'
      - 'atlas-router.js'
      - 'rideos-router.js'
      - 'package.json'
      - '.github/workflows/validate-music-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-music-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check modules/music-studio-worker.js
      - run: node --check atlas-router.js
      - run: node --check rideos-router.js
      - run: node scripts/validate-music-studio.mjs
      - run: npx wrangler deploy --dry-run
