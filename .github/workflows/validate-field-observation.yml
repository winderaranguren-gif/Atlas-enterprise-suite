name: Validate ATLAS Field Observation

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/creator-field-observation-worker.js'
      - 'rideos-router.js'
      - 'scripts/validate-field-observation.mjs'
      - 'package.json'
      - '.github/workflows/validate-field-observation.yml'
  push:
    branches: [main]
    paths:
      - 'modules/creator-field-observation-worker.js'
      - 'rideos-router.js'
      - 'scripts/validate-field-observation.mjs'
      - 'package.json'
      - '.github/workflows/validate-field-observation.yml'

jobs:
  validate-field-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check modules/creator-field-observation-worker.js
      - run: node --check scripts/validate-field-observation.mjs
      - run: node --check rideos-router.js
      - run: npm run check:field-observation
      - run: npm run check:creator-visual
      - run: npm run check:creator-mission
      - run: npm run check:universal-creator
      - run: npx wrangler deploy --dry-run
