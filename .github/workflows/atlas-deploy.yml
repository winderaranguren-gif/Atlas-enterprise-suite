name: ATLAS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ATLAS_BOOTSTRAP_KEY: ${{ secrets.ATLAS_BOOTSTRAP_KEY }}
      ATLAS_CUSTOM_DOMAIN: ${{ vars.ATLAS_CUSTOM_DOMAIN }}
      ATLAS_D1_DATABASE_NAME: ${{ vars.ATLAS_D1_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate required production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ATLAS_BOOTSTRAP_KEY"
          test -n "$ATLAS_CUSTOM_DOMAIN"

      - name: Reproducible install
        run: npm ci

      - name: Validate and build production release
        run: npm run build:prod

      - name: Resolve or provision D1 and generate runtime config
        run: node scripts/cloudflare-provision.mjs

      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply DB --remote --config .wrangler.runtime.json

      - name: Configure bootstrap secret
        shell: bash
        run: printf '%s' "$ATLAS_BOOTSTRAP_KEY" | npx --yes wrangler@4 secret put ATLAS_BOOTSTRAP_KEY --config .wrangler.runtime.json

      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4 deploy --config .wrangler.runtime.json

      - name: End-to-end production health check
        shell: bash
        run: |
          base="https://${ATLAS_CUSTOM_DOMAIN}"
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl --fail --silent --show-error --max-time 15 "$base/api/system/health")"; then
              printf '%s' "$body" | grep -q '"operational":true'
              exit 0
            fi
            sleep 5
          done
          echo 'ATLAS production health check failed'
          exit 1
