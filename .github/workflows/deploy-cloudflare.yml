name: Validate and Deploy ATLAS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Validate ATLAS Finance Intelligence
        run: npm run check:finance

      - name: Validate ATLAS launch queue modules
        run: npm run check:launch

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Mark ATLAS production pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"atlas/production","description":"ATLAS production deployment in progress"}' > /dev/null

      - uses: actions/checkout@v4

      - name: Normalize and verify Cloudflare credential
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RAW_CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^Bearer[[:space:]]+//I; s/^"//; s/"$//')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Cloudflare token became empty after normalization."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          HTTP_CODE="$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cloudflare API token verification failed with HTTP $HTTP_CODE."
            cat /tmp/cf-token.json | sed -E 's/(token|value|secret)"?:"?[A-Za-z0-9._-]+/***redacted***/Ig' || true
            exit 1
          fi
          echo "Cloudflare API token format verified."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Ensure ATLAS Cloudflare TURN relay
        env:
          CLOUDFLARE_ACCOUNT_ID: 1dd6dea2bb98459c66f610464354d686
        shell: bash
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx wrangler secret list 2>/dev/null || true)"
          if printf '%s' "$SECRET_LIST" | grep -q 'TURN_KEY_ID' && printf '%s' "$SECRET_LIST" | grep -q 'TURN_KEY_API_TOKEN'; then
            echo "ATLAS TURN Worker secrets already provisioned."
            exit 0
          fi

          echo "Provisioning Cloudflare Realtime TURN key for ATLAS Video..."
          HTTP_CODE="$(curl -sS -o /tmp/atlas-turn.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/calls/turn_keys" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"name":"atlas-video-turn"}' || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cloudflare TURN key creation failed with HTTP $HTTP_CODE. The API token needs Calls Write permission."
            node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/atlas-turn.json','utf8'));console.error(JSON.stringify({success:j.success,errors:j.errors?.map(e=>({code:e.code,message:e.message}))},null,2))}catch{}"
            exit 1
          fi

          TURN_KEY_ID="$(node -e "const j=require('/tmp/atlas-turn.json');process.stdout.write(j?.result?.uid||'')")"
          TURN_KEY_API_TOKEN="$(node -e "const j=require('/tmp/atlas-turn.json');process.stdout.write(j?.result?.key||'')")"
          if [ -z "$TURN_KEY_ID" ] || [ -z "$TURN_KEY_API_TOKEN" ]; then
            echo "::error::Cloudflare TURN response did not contain uid/key."
            exit 1
          fi
          echo "::add-mask::$TURN_KEY_ID"
          echo "::add-mask::$TURN_KEY_API_TOKEN"
          printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
          printf '%s' "$TURN_KEY_API_TOKEN" | npx wrangler secret put TURN_KEY_API_TOKEN
          echo "ATLAS TURN secrets stored in Cloudflare Worker."

      - name: Deploy ATLAS production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: 1dd6dea2bb98459c66f610464354d686
        run: npx wrangler deploy

      - name: Verify production endpoints
        shell: bash
        run: |
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/healthz
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS "https://atlasenterprisesuite.com/api/weather?lat=28.5383&lon=-81.3792"
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/dashboard > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/finance/health
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/finance > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/accounting > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/work/health
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/mobility/health
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/launch-queue/health
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/work > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/ride > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/driver > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/marketplace > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/driver-finance > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/launch-queue > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/video > /dev/null
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS "https://atlasenterprisesuite.com/api/video/ice?room=deploycheck" -o /tmp/atlas-ice.json
          node -e "const j=require('/tmp/atlas-ice.json');if(!j.ok||!Array.isArray(j.iceServers)||!j.iceServers.some(s=>(Array.isArray(s.urls)?s.urls:[s.urls]).some(u=>/^turns?:/.test(String(u))))){console.error(j);process.exit(1)};console.log('ATLAS TURN production verification passed.')"

      - name: Mark ATLAS production success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"atlas/production","description":"ATLAS production + TURN verified"}' > /dev/null

      - name: Mark ATLAS production failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"atlas/production","description":"ATLAS production deployment failed; inspect Actions"}' > /dev/null || true
