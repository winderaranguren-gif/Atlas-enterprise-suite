name: Deploy ATLAS Canonical Clean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-canonical-clean
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare credential present."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Deploy clean canonical Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1dd6dea2bb98459c66f610464354d686
        run: npx wrangler deploy

      - name: Verify canonical endpoints
        shell: bash
        run: |
          curl -fsS https://atlasenterprisesuite.com/health
          curl -fsS https://atlasenterprisesuite.com/api/readiness
