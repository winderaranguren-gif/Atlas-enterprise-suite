name: Validate ATLAS Mobile Identity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-mobile-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify Identity mobile navigation does not overlap content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {dispatchAtlasRequest} from './atlas/portable-runtime.mjs';
          const response = await dispatchAtlasRequest(new Request('http://atlas.local/identity'));
          if (!response.ok) throw new Error(`Identity returned ${response.status}`);
          const html = await response.text();
          const aside = html.match(/<aside class="platformLinks"[^>]*>([\s\S]*?)<\/aside>/)?.[1] || '';
          for (const label of ['ATLAS Menu','ATLAS Studio','Workbench','More']) {
            if (!aside.includes(label)) throw new Error(`Missing ${label} in compact normal-flow navigation`);
          }
          for (const destination of ['Browser','Music Studio','Production','Voice Engine']) {
            if (!html.includes(destination)) throw new Error(`Adaptive navigation missing ${destination}`);
          }
          if (!html.includes('Adaptive navigation')) throw new Error('Adaptive navigation surface is missing');
          if (!/@media\(max-width:\d+px\)/.test(html)) throw new Error('Identity mobile breakpoint is missing');
          if (!html.includes('.platformLinks{position:static')) throw new Error('Mobile platform links are not explicitly static');
          if (html.includes('position:fixed;right:14px;bottom:14px;z-index:999')) throw new Error('Legacy fixed launcher was injected');
          if (!html.includes('viewport-fit=cover')) throw new Error('Identity is not safe-area aware for iPhone');
          console.log('ATLAS Identity compact responsive navigation regression check passed');
          NODE
