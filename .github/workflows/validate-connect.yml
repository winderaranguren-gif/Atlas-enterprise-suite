name: Validate ATLAS Connect Network Fabric

on:
  pull_request:
    paths:
      - 'modules/connect-worker.js'
      - 'scripts/validate-connect.mjs'
      - 'docs/ATLAS_NETWORK_FABRIC.md'
      - 'package.json'
      - '.github/workflows/validate-connect.yml'
  push:
    branches:
      - main
    paths:
      - 'modules/connect-worker.js'
      - 'scripts/validate-connect.mjs'
      - 'docs/ATLAS_NETWORK_FABRIC.md'
      - 'package.json'
      - '.github/workflows/validate-connect.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:connect
      - run: npx wrangler deploy --dry-run
