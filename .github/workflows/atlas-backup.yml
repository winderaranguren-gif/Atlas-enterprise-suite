name: ATLAS D1 Backup

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ATLAS_D1_DATABASE_NAME: ${{ vars.ATLAS_D1_DATABASE_NAME }}
    steps:
      - name: Resolve 6 AM America/New_York backup window
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "06" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-node@v6
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate backup credentials
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Export D1 backup with SHA-256 manifest
        if: steps.window.outputs.run == 'true'
        run: node scripts/cloudflare-backup.mjs daily

      - name: Restore smoke test
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          file="$(find backups -name '*.sql' -type f | head -n 1)"
          test -n "$file"
          python3 - "$file" <<'PY'
          import sqlite3, sys
          sql_path = sys.argv[1]
          con = sqlite3.connect(':memory:')
          with open(sql_path, 'r', encoding='utf-8') as f:
              con.executescript(f.read())
          tables = [r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")]
          if not tables:
              raise SystemExit('backup restore produced no tables')
          print(f'ATLAS backup restore smoke test passed with {len(tables)} tables')
          PY

      - name: Preserve verified daily backup
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-d1-daily-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 30
