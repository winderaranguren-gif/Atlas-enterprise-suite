name: Validate ATLAS Browser

on:
  pull_request:
    paths:
      - 'modules/browser-worker.js'
      - 'rideos-router.js'
      - 'scripts/validate-browser.mjs'
      - 'package.json'
      - '.github/workflows/validate-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Browser module
        run: node --check modules/browser-worker.js
      - name: Syntax check main router
        run: node --check rideos-router.js
      - name: Run Browser contract validation
        run: node scripts/validate-browser.mjs
