name: Validate ATLAS Universal Creator

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/creator-universal-worker.js'
      - 'scripts/validate-universal-creator.mjs'
      - 'rideos-router.js'
      - 'package.json'
      - '.github/workflows/validate-universal-creator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-universal-creator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check modules/creator-universal-worker.js
      - run: node --check scripts/validate-universal-creator.mjs
      - run: node --check rideos-router.js
      - run: npm run check:universal-creator
      - run: npx wrangler deploy --dry-run
