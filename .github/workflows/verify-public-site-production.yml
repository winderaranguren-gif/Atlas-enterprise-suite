name: Verify ATLAS Public Website Production

on:
  workflow_run:
    workflows: ['Deploy ATLAS Production']
    types: [completed]

permissions:
  contents: read

jobs:
  verify-public-production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify rebuilt corporate home is production entry
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/ -o /tmp/atlas-home.html
          grep -Fq 'One platform.' /tmp/atlas-home.html
          grep -Fq 'Every solution.' /tmp/atlas-home.html
          grep -Fq 'Total control.' /tmp/atlas-home.html
          grep -Fq 'Menus now point somewhere meaningful.' /tmp/atlas-home.html
          grep -Fq 'ATLAS Design Library' /tmp/atlas-home.html
          grep -Fq 'Preview only. Module access begins after sign-in and authorization.' /tmp/atlas-home.html
          if grep -Eqi 'System Administrator|99\.98%|1,248|98% compliance|LIVE WEATHER|● LIVE' /tmp/atlas-home.html; then
            echo '::error::Public homepage contains internal persona, decorative metric, or unverified live-state text.'
            exit 1
          fi
          if grep -Eqi 'href="#"' /tmp/atlas-home.html; then
            echo '::error::Public homepage contains an empty hash navigation target.'
            exit 1
          fi

      - name: Verify ATLAS Design Library assets are served
        shell: bash
        run: |
          set -euo pipefail
          check(){ echo "Verifying $1"; curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "$1" -o /dev/null; }
          check https://www.atlasenterprisesuite.com/assets/atlas-orlando-dashboard.webp
          check https://www.atlasenterprisesuite.com/assets/atlas-enterprise-dashboard.webp
          check https://www.atlasenterprisesuite.com/assets/atlas-finance-command.webp
          check https://www.atlasenterprisesuite.com/assets/atlas-product-ecosystem.webp

      - name: Verify public product and trust pages
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/product | grep -Fq 'One suite. Specialized modules. Shared context.'
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/trust | grep -Fq 'Security claims must be verifiable.'
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/status | grep -Fq 'Unified public health feed: not configured'
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/identity -o /dev/null

      - name: Verify search landing pages and sitemap
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/product/connect -o /tmp/atlas-connect.html
          grep -Fq 'ATLAS Connect' /tmp/atlas-connect.html
          grep -Fq 'Network Fabric' /tmp/atlas-connect.html
          grep -Fq 'Device Registry' /tmp/atlas-connect.html
          grep -Fq '<link rel="canonical" href="https://www.atlasenterprisesuite.com/product/connect">' /tmp/atlas-connect.html
          grep -Fq 'meta property="og:title"' /tmp/atlas-connect.html
          grep -Fq 'twitter:card' /tmp/atlas-connect.html
          if grep -Eqi 'Verizon[[:space:]]+(is[[:space:]]+)?connected|Verizon[[:space:]]+online' /tmp/atlas-connect.html; then
            echo '::error::Public Connect page falsely reports Verizon as connected.'
            exit 1
          fi

          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/solutions/connectivity -o /tmp/atlas-connectivity.html
          grep -Fq 'carrier-neutral' /tmp/atlas-connectivity.html
          grep -Fq 'fail closed' /tmp/atlas-connectivity.html
          grep -Fq 'provider-verified' /tmp/atlas-connectivity.html

          curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/sitemap.xml -o /tmp/atlas-sitemap.xml
          grep -Fq 'https://www.atlasenterprisesuite.com/product/finance' /tmp/atlas-sitemap.xml
          grep -Fq 'https://www.atlasenterprisesuite.com/product/connect' /tmp/atlas-sitemap.xml
          grep -Fq 'https://www.atlasenterprisesuite.com/solutions/connectivity' /tmp/atlas-sitemap.xml
          grep -Fq '<lastmod>2026-08-22</lastmod>' /tmp/atlas-sitemap.xml
          if grep -Eq '/dashboard|/api/' /tmp/atlas-sitemap.xml; then
            echo '::error::Protected dashboard or API route entered the public sitemap.'
            exit 1
          fi

      - name: Verify application boundary and indexing policy
        shell: bash
        run: |
          set -euo pipefail
          APP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' https://www.atlasenterprisesuite.com/app)"
          APP_LOCATION="$(curl -sSI https://www.atlasenterprisesuite.com/app | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
          [ "$APP_STATUS" = '307' ]
          [ "$APP_LOCATION" = '/dashboard' ]
          ROBOTS="$(curl --retry 6 --retry-delay 4 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/robots.txt)"
          printf '%s' "$ROBOTS" | grep -Fq 'Disallow: /dashboard'
          printf '%s' "$ROBOTS" | grep -Fq 'Disallow: /api/'
          printf '%s' "$ROBOTS" | grep -Fq 'Sitemap: https://www.atlasenterprisesuite.com/sitemap.xml'
          DASH_HEADERS="$(curl -sSI https://www.atlasenterprisesuite.com/dashboard | tr -d '\r')"
          printf '%s' "$DASH_HEADERS" | grep -Eqi '^x-robots-tag: noindex, nofollow, noarchive$'

      - name: Verify security responsive and accessibility markers are served
        shell: bash
        run: |
          set -euo pipefail
          HOME="$(cat /tmp/atlas-home.html)"
          printf '%s' "$HOME" | grep -Fq 'Skip to content'
          printf '%s' "$HOME" | grep -Fq 'aria-label="Public navigation"'
          printf '%s' "$HOME" | grep -Fq '@media(max-width:760px)'
          HEADERS="$(curl -sSI https://www.atlasenterprisesuite.com/ | tr -d '\r')"
          printf '%s' "$HEADERS" | grep -Eqi "^content-security-policy:.*frame-ancestors 'none'"
          printf '%s' "$HEADERS" | grep -Eqi '^x-content-type-options: nosniff$'
