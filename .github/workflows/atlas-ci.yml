name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify dependency-free runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test -f package.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const runtimeDeps=Object.keys(pkg.dependencies||{});
          const devDeps=Object.keys(pkg.devDependencies||{});
          if(runtimeDeps.length||devDeps.length){
            console.error(JSON.stringify({error:'Dependencies declared without a committed lockfile',runtimeDeps,devDeps},null,2));
            process.exit(1);
          }
          console.log('ATLAS repository is dependency-free; npm install/ci is intentionally not required.');
          NODE

      - name: Validate ATLAS contracts and runtime
        run: npm run validate

      - name: Reproducible production build
        run: npm run build:prod

      - name: Verify Cloudflare contract
        run: |
          test -f wrangler.jsonc
          grep -q '"main": "worker/router.js"' wrangler.jsonc
          grep -q '"binding": "DB"' wrangler.jsonc
          grep -q '"migrations_dir": "migrations"' wrangler.jsonc
          grep -q '"run_worker_first": true' wrangler.jsonc
          grep -q '"crons": \["\*/10 \* \* \* \*"\]' wrangler.jsonc

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-production-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
