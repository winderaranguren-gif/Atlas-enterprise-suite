name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate ATLAS contracts and runtime
        run: npm run validate

      - name: Production build
        run: npm run build:prod

      - name: Verify Cloudflare configuration exists
        run: |
          test -f wrangler.jsonc
          grep -q '"main": "worker/index.js"' wrangler.jsonc
          grep -q '"binding": "DB"' wrangler.jsonc
          grep -q '"crons": \["\*/10 \* \* \* \*"\]' wrangler.jsonc

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-production-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
