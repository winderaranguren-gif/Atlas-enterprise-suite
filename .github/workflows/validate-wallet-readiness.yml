name: ATLAS Wallet Release Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate readiness gate syntax
        run: node --check scripts/wallet-release-readiness.mjs
      - name: Report release blockers without exposing secrets
        run: node scripts/wallet-release-readiness.mjs
