name: ATLAS Sovereign Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 06:00 America/New_York during EDT
  push:
    branches: [main]
    paths:
      - 'atlas-sovereign-vault/**'
      - 'scripts/atlas-backup.sh'
      - 'scripts/atlas-verify.sh'
      - '.github/workflows/atlas-sovereign-backup.yml'

permissions:
  contents: read

concurrency:
  group: atlas-sovereign-backup
  cancel-in-progress: false

jobs:
  backup-and-verify:
    name: Build and verify ATLAS backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build sovereign snapshot
        shell: bash
        run: |
          chmod +x scripts/atlas-backup.sh scripts/atlas-verify.sh
          scripts/atlas-backup.sh .

      - name: Verify latest snapshot
        shell: bash
        run: |
          ARCHIVE="$(ls -1t .atlas-backups/atlas-backup-*.tar.gz | head -n1)"
          scripts/atlas-verify.sh "$ARCHIVE" "${ARCHIVE}.sha256"

      - name: Publish encrypted-boundary backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-sovereign-backup-${{ github.run_id }}
          path: |
            .atlas-backups/*.tar.gz
            .atlas-backups/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Write recovery summary
        shell: bash
        run: |
          ARCHIVE="$(basename "$(ls -1t .atlas-backups/atlas-backup-*.tar.gz | head -n1)")"
          {
            echo '## ATLAS Sovereign Backup'
            echo ''
            echo "- Snapshot: \`$ARCHIVE\`"
            echo '- Integrity: SHA-256 verified'
            echo '- Secrets: excluded by policy'
            echo '- Retention: 90 days'
            echo '- Recovery manifest: present'
          } >> "$GITHUB_STEP_SUMMARY"
