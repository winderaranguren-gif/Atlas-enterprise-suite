name: Validate ATLAS Git Deploy Tools

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-git-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate Git and deploy orchestration contracts
        run: npm run check:git-deploy
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
