name: ATLAS Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ATLAS QA
        run: npm run qa:release

  production-sentinel:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    env:
      ATLAS_RELEASE_MODE: production
      ATLAS_RELEASE_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release identity
        run: node scripts/release-sentinel.mjs
