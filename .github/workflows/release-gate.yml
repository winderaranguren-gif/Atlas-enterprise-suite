name: ATLAS Release Gate

# Automatic GitHub-hosted release gating is intentionally paused while the
# account runner is blocked by GitHub billing/spending limits. Cloudflare keeps
# handling automatic deployment checks. This gate can still be run manually.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ATLAS QA
        run: npm run qa:release

  production-sentinel:
    needs: qa
    runs-on: ubuntu-latest
    env:
      ATLAS_RELEASE_MODE: production
      ATLAS_RELEASE_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release identity
        run: node scripts/release-sentinel.mjs
