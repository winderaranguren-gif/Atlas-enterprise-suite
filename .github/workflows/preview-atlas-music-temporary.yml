name: Preview ATLAS Music Temporary

on:
  push:
    branches:
      - preview/atlas-music-live-20260822
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/preview-atlas-music-temporary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate ATLAS Music
        run: |
          node --check modules/music-studio-worker.js
          node --check rideos-router.js
          node scripts/validate-music-studio.mjs
          npx wrangler deploy --dry-run
      - name: Build isolated preview configuration
        shell: bash
        run: |
          cat > wrangler.preview.jsonc <<'JSON'
          {
            "name": "atlas-music-preview",
            "main": "rideos-router.js",
            "compatibility_date": "2026-08-12",
            "workers_dev": true,
            "assets": {
              "directory": "./public",
              "binding": "ASSETS",
              "run_worker_first": true
            },
            "durable_objects": {
              "bindings": [
                {"name": "VIDEO_ROOMS", "class_name": "VideoRoom"},
                {"name": "CONNECT_STORE", "class_name": "ConnectStore"},
                {"name": "CAPABILITY_STATE_STORE", "class_name": "CapabilityStateStore"},
                {"name": "WALLET_STORE", "class_name": "WalletStore"}
              ]
            },
            "migrations": [
              {"tag": "v1-video-room", "new_sqlite_classes": ["VideoRoom"]},
              {"tag": "v2-connect-store", "new_sqlite_classes": ["ConnectStore"]},
              {"tag": "v3-capability-state-store", "new_sqlite_classes": ["CapabilityStateStore"]},
              {"tag": "v4-wallet-store", "new_sqlite_classes": ["WalletStore"]}
            ]
          }
          JSON
      - name: Deploy temporary Cloudflare preview without account credentials
        id: preview
        env:
          CI: '1'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --temporary --config wrangler.preview.jsonc 2>&1 | tee /tmp/atlas-music-preview.log
          URL="$(grep -Eo 'https://[^[:space:]]+' /tmp/atlas-music-preview.log | grep -E 'workers\.dev' | tail -n 1 | sed 's/[),.;]*$//' || true)"
          CLAIM="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?[^[:space:]]+' /tmp/atlas-music-preview.log | tail -n 1 | sed 's/[),.;]*$//' || true)"
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo '## ATLAS Music temporary preview'
            if [ -n "$URL" ]; then echo "Preview: $URL/studio/music"; else echo 'Preview URL was not detected automatically; inspect the deployment log.'; fi
            if [ -n "$CLAIM" ]; then echo "Cloudflare claim: $CLAIM"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test ATLAS Music preview
        if: steps.preview.outputs.preview_url != ''
        shell: bash
        run: |
          set -euo pipefail
          BASE='${{ steps.preview.outputs.preview_url }}'
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE/studio/music" -o /tmp/music.html
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$BASE/api/studio/music/health" -o /tmp/music-health.json
          grep -q 'ATLAS MUSIC' /tmp/music.html
          node -e "const j=require('/tmp/music-health.json');if(!j.ok||j.module!=='ATLAS Music')process.exit(1)"
          echo "ATLAS Music preview verified at $BASE/studio/music" >> "$GITHUB_STEP_SUMMARY"
