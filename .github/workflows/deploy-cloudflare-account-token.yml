name: Deploy ATLAS with Cloudflare Account Token

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-account-token.yml'
      - 'rideos-router.js'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'modules/**'
      - 'public/**'
      - 'package.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: atlas-account-token-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 1dd6dea2bb98459c66f610464354d686

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:finance
      - run: npm run check:launch
      - run: npm run check:public-site
      - run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify Cloudflare API token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAW_CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          TOKEN="$(node <<'NODE'
          const raw = process.env.RAW_CLOUDFLARE_API_TOKEN || '';
          let s = raw.replace(/[\r\n]/g, '').trim();
          try {
            const parsed = JSON.parse(s);
            if (typeof parsed === 'string') s = parsed;
            else if (parsed && typeof parsed === 'object') s = parsed.token || parsed.apiToken || parsed.value || parsed.CLOUDFLARE_API_TOKEN || s;
          } catch {}
          s = String(s)
            .trim()
            .replace(/^CLOUDFLARE_API_TOKEN\s*=\s*/i, '')
            .replace(/^Authorization\s*:\s*/i, '')
            .replace(/^Bearer\s+/i, '')
            .replace(/^["'`]+|["'`]+$/g, '')
            .trim();
          process.stdout.write(s);
          NODE
          )"

          if [ -z "$TOKEN" ] || printf '%s' "$TOKEN" | grep -q '[[:space:]]'; then
            echo "::error::Cloudflare token is empty or malformed after normalization."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          VERIFIED=""
          for URL in \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify"; do
            HTTP_CODE="$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$URL" || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              STATUS="$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/cf-token.json','utf8'));process.stdout.write(j.success===true && j.result?.status==='active'?'active':'invalid')}catch{process.stdout.write('invalid')}")"
              if [ "$STATUS" = "active" ]; then
                VERIFIED="$URL"
                break
              fi
            fi
          done

          if [ -z "$VERIFIED" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN failed both user-token and account-token verification endpoints."
            exit 1
          fi

          echo "Cloudflare API token verified."
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Ensure TURN relay secrets exist
        shell: bash
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx wrangler secret list 2>/dev/null || true)"
          if printf '%s' "$SECRET_LIST" | grep -q 'TURN_KEY_ID' && printf '%s' "$SECRET_LIST" | grep -q 'TURN_KEY_API_TOKEN'; then
            echo "ATLAS TURN Worker secrets already provisioned."
            exit 0
          fi

          HTTP_CODE="$(curl -sS -o /tmp/atlas-turn.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/calls/turn_keys" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"name":"atlas-video-turn"}' || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::TURN key creation failed with HTTP $HTTP_CODE. Token needs Calls Write permission if TURN secrets are not already present."
            exit 1
          fi

          TURN_KEY_ID="$(node -e "const j=require('/tmp/atlas-turn.json');process.stdout.write(j?.result?.uid||'')")"
          TURN_KEY_API_TOKEN="$(node -e "const j=require('/tmp/atlas-turn.json');process.stdout.write(j?.result?.key||'')")"
          [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_API_TOKEN" ]
          echo "::add-mask::$TURN_KEY_ID"
          echo "::add-mask::$TURN_KEY_API_TOKEN"
          printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
          printf '%s' "$TURN_KEY_API_TOKEN" | npx wrangler secret put TURN_KEY_API_TOKEN

      - name: Deploy canonical ATLAS Worker
        run: npx wrangler deploy

      - name: Verify production application surfaces
        shell: bash
        run: |
          set -euo pipefail
          check(){ echo "Verifying $1"; curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "$1" > /dev/null; }
          check https://atlasenterprisesuite.com/healthz
          check https://atlasenterprisesuite.com/dashboard
          check https://atlasenterprisesuite.com/finance
          check https://atlasenterprisesuite.com/accounting
          check https://atlasenterprisesuite.com/work
          check https://atlasenterprisesuite.com/ride
          check https://atlasenterprisesuite.com/rideos
          check https://atlasenterprisesuite.com/driver
          check https://atlasenterprisesuite.com/marketplace
          check https://atlasenterprisesuite.com/driver-finance
          check https://atlasenterprisesuite.com/launch-queue
          check https://atlasenterprisesuite.com/video
          check https://atlasenterprisesuite.com/studio
          check https://atlasenterprisesuite.com/api/work/health
          check https://atlasenterprisesuite.com/api/mobility/health
          check https://atlasenterprisesuite.com/api/rideos/health
          check https://atlasenterprisesuite.com/api/launch-queue/health
          check https://atlasenterprisesuite.com/api/studio/health
          check https://atlasenterprisesuite.com/api/finance/health

      - name: Verify public website boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/ -o /tmp/atlas-home.html
          grep -Fq 'Run the work.' /tmp/atlas-home.html
          grep -Fq 'Public website outside. Enterprise workspace inside.' /tmp/atlas-home.html
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/product | grep -Fq 'The ATLAS enterprise'
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/trust | grep -Fq 'Security claims must be verifiable.'
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/status | grep -Fq 'Unified public health feed: not configured'
          APP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' https://www.atlasenterprisesuite.com/app)"
          APP_LOCATION="$(curl -sSI https://www.atlasenterprisesuite.com/app | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
          [ "$APP_STATUS" = '307' ]
          [ "$APP_LOCATION" = '/dashboard' ]
          DASH_HEADERS="$(curl -sSI https://www.atlasenterprisesuite.com/dashboard | tr -d '\r')"
          printf '%s' "$DASH_HEADERS" | grep -Eqi '^x-robots-tag: noindex, nofollow, noarchive$'

      - name: Mark ATLAS production success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"atlas/production\",\"description\":\"ATLAS production verified with Cloudflare account-token compatible CI\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > /dev/null

      - name: Mark ATLAS production failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"atlas/production\",\"description\":\"ATLAS account-token production deployment failed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > /dev/null || true
