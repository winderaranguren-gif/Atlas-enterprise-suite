name: Deploy ATLAS

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: atlas-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ATLAS_D1_DATABASE_NAME: ${{ secrets.ATLAS_D1_DATABASE_NAME }}
  ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
  ATLAS_PRODUCTION_BASE_URL: ${{ secrets.ATLAS_PRODUCTION_BASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository
        run: npm run check

      - name: Render production bindings
        run: node scripts/render-production-wrangler.mjs

      - name: Require deployment secrets
        env:
          ATLAS_BOOTSTRAP_TOKEN: ${{ secrets.ATLAS_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ATLAS_D1_DATABASE_NAME"
          test -n "$ATLAS_D1_DATABASE_ID"
          test -n "$ATLAS_PRODUCTION_BASE_URL"
          test -n "$ATLAS_BOOTSTRAP_TOKEN"
          test ${#ATLAS_BOOTSTRAP_TOKEN} -ge 32

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$ATLAS_D1_DATABASE_NAME" --remote --config wrangler.production.jsonc

      - name: Configure bootstrap secret
        env:
          ATLAS_BOOTSTRAP_TOKEN: ${{ secrets.ATLAS_BOOTSTRAP_TOKEN }}
        run: printf '%s' "$ATLAS_BOOTSTRAP_TOKEN" | npx wrangler secret put ATLAS_BOOTSTRAP_TOKEN --config wrangler.production.jsonc

      - name: Deploy exact commit
        run: npx wrangler deploy --config wrangler.production.jsonc --var ATLAS_DEPLOYED_SHA:${GITHUB_SHA}

      - name: Verify production health
        run: |
          health="$(curl --fail --silent --show-error "$ATLAS_PRODUCTION_BASE_URL/api/status")"
          ready="$(curl --fail --silent --show-error "$ATLAS_PRODUCTION_BASE_URL/api/ready")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok) process.exit(1)' "$health"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||!x.ready||!x.d1) process.exit(1)' "$ready"
