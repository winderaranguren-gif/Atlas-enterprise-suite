name: Deploy ATLAS

on:
  workflow_run:
    workflows: ["ATLAS CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-production
  cancel-in-progress: false

jobs:
  deploy-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ATLAS_D1_DATABASE_NAME: ${{ secrets.ATLAS_D1_DATABASE_NAME }}
      ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
      ATLAS_BACKUPS_BUCKET_NAME: ${{ secrets.ATLAS_BACKUPS_BUCKET_NAME }}
      ATLAS_BOOTSTRAP_TOKEN: ${{ secrets.ATLAS_BOOTSTRAP_TOKEN }}
      ATLAS_PRODUCTION_BASE_URL: ${{ secrets.ATLAS_PRODUCTION_BASE_URL }}
      ATLAS_E2E_BEARER_TOKEN: ${{ secrets.ATLAS_E2E_BEARER_TOKEN }}
      ATLAS_E2E_ORGANIZATION_ID: ${{ secrets.ATLAS_E2E_ORGANIZATION_ID }}
      ATLAS_E2E_DBA_ID: ${{ secrets.ATLAS_E2E_DBA_ID }}
      ATLAS_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ATLAS_RELEASE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release and verify exact production commit
        run: node scripts/release-production.mjs
