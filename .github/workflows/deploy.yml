name: Deploy ATLAS
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: atlas-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check src/index.js
      - run: npm run validate
      - name: Render production Cloudflare bindings
        run: node scripts/render-production-wrangler.mjs
        env:
          ATLAS_D1_DATABASE_NAME: ${{ secrets.ATLAS_D1_DATABASE_NAME }}
          ATLAS_D1_DATABASE_ID: ${{ secrets.ATLAS_D1_DATABASE_ID }}
          ATLAS_BACKUPS_BUCKET_NAME: ${{ secrets.ATLAS_BACKUPS_BUCKET_NAME }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ATLAS_DB --remote --config wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy exact main SHA
        run: npx wrangler deploy --config wrangler.production.toml --var ATLAS_RELEASE_SHA:${GITHUB_SHA}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health and readiness
        shell: bash
        env:
          ATLAS_PRODUCTION_BASE_URL: ${{ secrets.ATLAS_PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${ATLAS_PRODUCTION_BASE_URL:-}" || { echo "ATLAS_PRODUCTION_BASE_URL is required"; exit 1; }
          base="${ATLAS_PRODUCTION_BASE_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$base/health" | tee /tmp/atlas-health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$base/ready" | tee /tmp/atlas-ready.json
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/atlas-health.json')); const r=JSON.parse(fs.readFileSync('/tmp/atlas-ready.json')); if(h.ok!==true) throw new Error('health_not_ok'); if(r.ready!==true) throw new Error('runtime_not_ready'); if(!r.bindings?.d1 || !r.bindings?.r2) throw new Error('cloudflare_bindings_not_ready');"
      - name: Remove rendered production config
        if: always()
        run: rm -f wrangler.production.toml
