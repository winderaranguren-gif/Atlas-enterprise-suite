name: Validate ATLAS Workbench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate sovereign Workbench
        run: npm run check:workbench
      - name: Validate ATLAS build graph
        run: npm run atlas:build
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
