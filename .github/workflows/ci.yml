name: ATLAS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ATLAS Core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Validate ATLAS JavaScript
        run: npm run check:js

      - name: Validate ATLAS database package
        run: npm run check:db

      - name: Verify Supabase configuration references
        shell: bash
        run: |
          set -euo pipefail
          grep -R --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' -q "SUPABASE_URL" .
          grep -R --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' -q "SUPABASE_ANON_KEY\|SUPABASE_PUBLISHABLE_KEY" .
          echo "ATLAS Supabase configuration references verified."
