name: ATLAS CI

# Automatic GitHub-hosted CI is intentionally paused while the account runner
# is blocked by GitHub billing/spending limits. Cloudflare remains the automatic
# deployment check. Keep this workflow available for manual validation later.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:prod
