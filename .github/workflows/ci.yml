name: ATLAS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ATLAS Core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript and database package
        run: npm run validate

      - name: Verify required Supabase configuration references
        shell: bash
        run: |
          set -euo pipefail

          required_patterns=(
            "SUPABASE_URL"
            "SUPABASE_ANON_KEY"
          )

          for pattern in "${required_patterns[@]}"; do
            if ! grep -R --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' -q "$pattern" .; then
              echo "::error::Required configuration reference not found: $pattern"
              exit 1
            fi
          done

          echo "Supabase configuration references are present. Runtime secret values remain outside source control."
