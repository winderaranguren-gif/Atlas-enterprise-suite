name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ATLAS Core
        run: node scripts/validate.mjs
      - name: Validate ATLAS CRM
        run: node scripts/validate-crm.mjs
      - name: Validate Performance Optimizer
        run: node scripts/validate-performance-optimizer.mjs
