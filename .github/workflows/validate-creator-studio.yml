name: Validate Creator Studio

on:
  pull_request:
    paths:
      - 'modules/creator-studio-worker.js'
      - 'scripts/validate-creator-studio.mjs'
      - 'docs/ATLAS_CREATOR_STUDIO_TIKTOK_BENCHMARK.md'
      - '.github/workflows/validate-creator-studio.yml'
  push:
    branches: [main]
    paths:
      - 'modules/creator-studio-worker.js'
      - 'scripts/validate-creator-studio.mjs'
      - 'docs/ATLAS_CREATOR_STUDIO_TIKTOK_BENCHMARK.md'
      - '.github/workflows/validate-creator-studio.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check modules/creator-studio-worker.js
      - name: Creator Studio validation
        run: node scripts/validate-creator-studio.mjs
