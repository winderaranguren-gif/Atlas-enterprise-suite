name: Deploy ATLAS Direct with Wrangler

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-direct.yml'
      - 'rideos-router.js'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'modules/**'
      - 'public/**'
      - 'package.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: atlas-wrangler-direct-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 1dd6dea2bb98459c66f610464354d686

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:finance
      - run: npm run check:launch
      - run: npm run check:public-site
      - run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Recover and verify Cloudflare token safely
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAW_CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          node <<'NODE'
          const fs=require('fs');
          const raw=String(process.env.RAW_CLOUDFLARE_API_TOKEN||'');
          const candidates=[];
          const add=v=>{
            v=String(v??'')
              .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
              .replace(/[\r\n\t]/g,'')
              .trim()
              .replace(/^["'`“”‘’]+|["'`“”‘’]+$/g,'')
              .trim();
            if(v && !candidates.includes(v)) candidates.push(v);
          };
          const walk=v=>{
            if(typeof v==='string') add(v);
            else if(Array.isArray(v)) v.forEach(walk);
            else if(v&&typeof v==='object') Object.values(v).forEach(walk);
          };

          add(raw);
          try { walk(JSON.parse(raw)); } catch {}

          const clean=raw
            .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
            .replace(/[\r\n\t]/g,' ');

          for(const m of clean.matchAll(/\b(?:cfat|cfut)_[A-Za-z0-9_-]{10,}\b/g)) add(m[0]);
          for(const m of clean.matchAll(/[A-Za-z0-9_-]{30,}/g)) add(m[0]);

          for(const v of [...candidates]) {
            add(v.replace(/^\s*CLOUDFLARE_API_TOKEN\s*=\s*/i,''));
            add(v.replace(/^\s*(?:API\s*TOKEN|TOKEN)\s*[:=]\s*/i,''));
            add(v.replace(/^\s*Authorization\s*:\s*/i,''));
            add(v.replace(/^\s*Bearer\s+/i,''));
            const bearer=v.match(/Bearer\s+([^\s"'`“”‘’},;]+)/i); if(bearer) add(bearer[1]);
            const assign=v.match(/(?:CLOUDFLARE_API_TOKEN|API_TOKEN|TOKEN)\s*[:=]\s*["'`“”‘’]?([^\s"'`“”‘’},;]+)/i); if(assign) add(assign[1]);
          }

          const normalized=[];
          for(const v of candidates){
            const s=v
              .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
              .replace(/^\s*CLOUDFLARE_API_TOKEN\s*=\s*/i,'')
              .replace(/^\s*(?:API\s*TOKEN|TOKEN)\s*[:=]\s*/i,'')
              .replace(/^\s*Authorization\s*:\s*/i,'')
              .replace(/^\s*Bearer\s+/i,'')
              .replace(/^["'`“”‘’]+|["'`“”‘’]+$/g,'')
              .trim();
            if(s && !/[\s\x00-\x1F\x7F]/.test(s) && !normalized.includes(s)) normalized.push(s);
          }

          fs.writeFileSync('/tmp/atlas-cf-candidates.json',JSON.stringify(normalized));
          const safe={
            rawLength:[...raw].length,
            candidates:normalized.length,
            prefixedCandidates:normalized.filter(v=>/^cf(?:at|ut)_/.test(v)).length,
            rawContainsWhitespace:/\s/.test(raw),
            rawContainsColon:/:/.test(raw),
            rawContainsEquals:/=/.test(raw)
          };
          fs.writeFileSync('/tmp/atlas-cf-safe-diagnostics.json',JSON.stringify(safe));
          console.log(`Prepared ${normalized.length} masked token candidate(s).`);
          NODE

          COUNT="$(node -e "const a=require('/tmp/atlas-cf-candidates.json');process.stdout.write(String(a.length))")"
          SELECTED=""
          for ((i=0;i<COUNT;i++)); do
            CANDIDATE="$(node -e "const a=require('/tmp/atlas-cf-candidates.json');process.stdout.write(a[Number(process.argv[1])]||'')" "$i")"
            [ -n "$CANDIDATE" ] || continue
            echo "::add-mask::$CANDIDATE"
            for URL in \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify"; do
              HTTP_CODE="$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' -H "Authorization: Bearer $CANDIDATE" -H 'Content-Type: application/json' "$URL" || true)"
              if [ "$HTTP_CODE" = "200" ]; then
                ACTIVE="$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/cf-check.json','utf8'));process.stdout.write(j.success===true&&j.result?.status==='active'?'yes':'no')}catch{process.stdout.write('no')}")"
                if [ "$ACTIVE" = "yes" ]; then
                  SELECTED="$CANDIDATE"
                  break 2
                fi
              fi
            done
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::No recoverable Cloudflare API token in CLOUDFLARE_API_TOKEN validated for the configured ATLAS account."
            echo "Safe credential diagnostics:"
            cat /tmp/atlas-cf-safe-diagnostics.json
            exit 1
          fi

          echo "::add-mask::$SELECTED"
          echo "CLOUDFLARE_API_TOKEN=$SELECTED" >> "$GITHUB_ENV"
          echo "Cloudflare token recovered and validated without exposing its value."

      - name: Deploy canonical ATLAS Worker with Wrangler
        run: npx wrangler deploy

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          check(){ echo "Verifying $1"; curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "$1" > /dev/null; }
          check https://atlasenterprisesuite.com/healthz
          check https://atlasenterprisesuite.com/dashboard
          check https://atlasenterprisesuite.com/finance
          check https://atlasenterprisesuite.com/accounting
          check https://atlasenterprisesuite.com/work
          check https://atlasenterprisesuite.com/ride
          check https://atlasenterprisesuite.com/rideos
          check https://atlasenterprisesuite.com/driver
          check https://atlasenterprisesuite.com/marketplace
          check https://atlasenterprisesuite.com/driver-finance
          check https://atlasenterprisesuite.com/launch-queue
          check https://atlasenterprisesuite.com/video
          check https://atlasenterprisesuite.com/studio
          check https://atlasenterprisesuite.com/api/work/health
          check https://atlasenterprisesuite.com/api/mobility/health
          check https://atlasenterprisesuite.com/api/rideos/health
          check https://atlasenterprisesuite.com/api/launch-queue/health
          check https://atlasenterprisesuite.com/api/studio/health
          check https://atlasenterprisesuite.com/api/finance/health

      - name: Verify TURN production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "https://atlasenterprisesuite.com/api/video/ice?room=deploycheck" -o /tmp/atlas-ice.json
          node -e "const j=require('/tmp/atlas-ice.json');if(!j.ok||!Array.isArray(j.iceServers)||!j.iceServers.some(s=>(Array.isArray(s.urls)?s.urls:[s.urls]).some(u=>/^turns?:/.test(String(u))))){console.error(j);process.exit(1)};console.log('ATLAS TURN production verification passed.')"

      - name: Verify public website boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/ -o /tmp/atlas-home.html
          grep -Fq 'Run the work.' /tmp/atlas-home.html
          grep -Fq 'Public website outside. Enterprise workspace inside.' /tmp/atlas-home.html
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/product | grep -Fq 'The ATLAS enterprise'
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/trust | grep -Fq 'Security claims must be verifiable.'
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/status | grep -Fq 'Unified public health feed: not configured'
          APP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' https://www.atlasenterprisesuite.com/app)"
          APP_LOCATION="$(curl -sSI https://www.atlasenterprisesuite.com/app | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
          [ "$APP_STATUS" = '307' ]
          [ "$APP_LOCATION" = '/dashboard' ]
          DASH_HEADERS="$(curl -sSI https://www.atlasenterprisesuite.com/dashboard | tr -d '\r')"
          printf '%s' "$DASH_HEADERS" | grep -Eqi '^x-robots-tag: noindex, nofollow, noarchive$'

      - name: Mark ATLAS production success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"atlas/production\",\"description\":\"ATLAS production + TURN + public website verified\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > /dev/null

      - name: Mark ATLAS production failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"atlas/production\",\"description\":\"Cloudflare token recovery/deploy failed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > /dev/null || true
