name: Deploy ATLAS Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-direct.yml'
      - 'scripts/resolve-cloudflare-auth.mjs'
      - 'rideos-router.js'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'modules/**'
      - 'atlas/native-media-engine.mjs'
      - 'scripts/validate-native-studio.mjs'
      - 'scripts/validate-studio-autopilot.mjs'
      - 'scripts/validate-media-qc.mjs'
      - 'scripts/validate-media-foundations.mjs'
      - 'scripts/validate-voice-lipsync-resolution.mjs'
      - 'scripts/validate-universal-creator.mjs'
      - 'public/**'
      - 'package.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: atlas-production-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 1dd6dea2bb98459c66f610464354d686

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:finance
      - run: npm run check:launch
      - run: npm run check:public-site
      - run: npm run check:creator-web
      - run: npm run check:universal-creator
      - run: npm run check:native-studio
      - run: npm run check:studio-autopilot
      - run: npm run check:media-qc
      - run: npm run check:media-foundations
      - run: npm run check:voice-lipsync-resolution
      - run: node atlas/native-media-engine.mjs verify
      - run: node --check scripts/resolve-cloudflare-auth.mjs
      - run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Resolve Cloudflare authentication
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/resolve-cloudflare-auth.mjs

      - name: Verify Cloudflare account access
        run: npx wrangler whoami

      - name: Verify TURN secrets exist
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx wrangler secret list)"
          printf '%s' "$LIST" | grep -q 'TURN_KEY_ID'
          printf '%s' "$LIST" | grep -q 'TURN_KEY_API_TOKEN'

      - name: Deploy canonical ATLAS Worker
        run: npx wrangler deploy

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          check(){ echo "Verifying $1"; curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "$1" > /dev/null; }
          check https://atlasenterprisesuite.com/healthz
          check https://atlasenterprisesuite.com/dashboard
          check https://atlasenterprisesuite.com/finance
          check https://atlasenterprisesuite.com/accounting
          check https://atlasenterprisesuite.com/work
          check https://atlasenterprisesuite.com/ride
          check https://atlasenterprisesuite.com/rideos
          check https://atlasenterprisesuite.com/driver
          check https://atlasenterprisesuite.com/marketplace
          check https://atlasenterprisesuite.com/driver-finance
          check https://atlasenterprisesuite.com/launch-queue
          check https://atlasenterprisesuite.com/video
          check https://atlasenterprisesuite.com/studio
          check https://atlasenterprisesuite.com/studio/create-anything
          check https://atlasenterprisesuite.com/studio/creator/web
          check https://atlasenterprisesuite.com/studio/autopilot
          check https://atlasenterprisesuite.com/studio/look
          check https://atlasenterprisesuite.com/studio/subject
          check https://atlasenterprisesuite.com/studio/speech
          check https://atlasenterprisesuite.com/studio/voice
          check https://atlasenterprisesuite.com/studio/lipsync
          check https://atlasenterprisesuite.com/studio/resolution
          check https://atlasenterprisesuite.com/studio/qc
          check https://atlasenterprisesuite.com/studio/production
          check https://atlasenterprisesuite.com/api/studio/creator/universal/capabilities
          check https://atlasenterprisesuite.com/api/studio/creator/universal/presets
          check https://atlasenterprisesuite.com/api/studio/creator/web/capabilities
          check https://atlasenterprisesuite.com/api/studio/autopilot/health
          check https://atlasenterprisesuite.com/api/studio/autopilot/capabilities
          check https://atlasenterprisesuite.com/api/studio/look/capabilities
          check https://atlasenterprisesuite.com/api/studio/subject/capabilities
          check https://atlasenterprisesuite.com/api/studio/speech/capabilities
          check https://atlasenterprisesuite.com/api/studio/voice/capabilities
          check https://atlasenterprisesuite.com/api/studio/lipsync/capabilities
          check https://atlasenterprisesuite.com/api/studio/resolution/capabilities
          check https://atlasenterprisesuite.com/api/studio/qc/health
          check https://atlasenterprisesuite.com/api/studio/qc/capabilities
          check https://atlasenterprisesuite.com/api/work/health
          check https://atlasenterprisesuite.com/api/mobility/health
          check https://atlasenterprisesuite.com/api/rideos/health
          check https://atlasenterprisesuite.com/api/launch-queue/health
          check https://atlasenterprisesuite.com/api/studio/health
          check https://atlasenterprisesuite.com/api/studio/production/health
          check https://atlasenterprisesuite.com/api/finance/health

      - name: Verify ATLAS Universal Creator independence
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/creator/universal/capabilities -o /tmp/universal-creator.json
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/creator/universal/presets -o /tmp/universal-presets.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/universal-creator.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/universal-presets.json','utf8'));
          if(c.service!=='atlas-universal-creator') throw new Error('Universal Creator service mismatch');
          if(!Array.isArray(c.externalProviders) || c.externalProviders.length!==0) throw new Error('External builder detected in Universal Creator');
          const ready=(c.capabilities||[]).filter(x=>x.state==='ready').map(x=>x.id);
          for(const id of ['intake','classification','module-owner','architecture','permissions','handoff','quality','preset-main-dashboard']) if(!ready.includes(id)) throw new Error(`Missing Universal Creator capability: ${id}`);
          const main=(p.presets||[]).find(x=>x.id==='main-dashboard');
          if(!main || main.route!=='/' || main.releaseRoute!=='/studio/release/main-dashboard') throw new Error('Main Dashboard preset contract mismatch');
          console.log('ATLAS Universal Creator Main Dashboard preset verified.');
          NODE

      - name: Verify ATLAS Creator Web Director independence
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/creator/web/capabilities -o /tmp/creator-web.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/creator-web.json','utf8'));
          if(j.service!=='atlas-creator-web-director') throw new Error('Creator Web Director service mismatch');
          if(!Array.isArray(j.externalProviders) || j.externalProviders.length!==0) throw new Error('External web builder detected');
          const ready=(j.capabilities||[]).filter(x=>x.state==='ready').map(x=>x.id);
          for(const id of ['visual-spec','classification','information-architecture','public-boundary','responsive','data-policy','implementation-handoff']) if(!ready.includes(id)) throw new Error(`Missing Creator Web capability: ${id}`);
          console.log('ATLAS Creator Web Director production contract verified.');
          NODE

      - name: Verify ATLAS Studio Autopilot independence
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/autopilot/capabilities -o /tmp/studio-autopilot.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/studio-autopilot.json','utf8'));
          if(j.service!=='atlas-studio-autopilot') throw new Error('Studio Autopilot service mismatch');
          if(!Array.isArray(j.externalProviders) || j.externalProviders.length!==0) throw new Error('External creative provider detected in Autopilot');
          if(j.externalProviderRequired!==false || j.mediaLeavesDeviceByDefault!==false) throw new Error('Autopilot first-party policy mismatch');
          const ready=(j.capabilities||[]).filter(x=>x.state==='ready').map(x=>x.id);
          for(const id of ['recipe-handoff','audio-energy','motion-energy','variant-selection','hook-cta','script-captions','audio-cleanup','batch-render']) if(!ready.includes(id)) throw new Error(`Missing Autopilot capability: ${id}`);
          console.log('ATLAS Studio Autopilot production contract verified.');
          NODE

      - name: Verify ATLAS media foundations independence
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/look/capabilities -o /tmp/look.json
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/subject/capabilities -o /tmp/subject.json
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/speech/capabilities -o /tmp/speech.json
          node - <<'NODE'
          const fs=require('fs');
          const services=[
            ['look',JSON.parse(fs.readFileSync('/tmp/look.json','utf8')),'atlas-look-engine',['histogram','auto-exposure','gray-world','tone-curve','color','vignette','presets','identity-safe']],
            ['subject',JSON.parse(fs.readFileSync('/tmp/subject.json','utf8')),'atlas-subject-engine',['motion-centroid','subject-lock','crop-keyframes','portrait-reframe','safe-margins']],
            ['speech',JSON.parse(fs.readFileSync('/tmp/speech.json','utf8')),'atlas-speech-engine',['decode','vad','silence-map','rms','script-timing','srt-export']]
          ];
          for(const [name,j,service,required] of services){
            if(j.service!==service) throw new Error(`${name} service mismatch`);
            if(!Array.isArray(j.externalProviders)||j.externalProviders.length!==0) throw new Error(`${name} external provider detected`);
            if(j.externalProviderRequired!==false||j.mediaLeavesDeviceByDefault!==false||j.localProcessing!==true) throw new Error(`${name} local-first policy mismatch`);
            const ready=(j.capabilities||[]).filter(x=>x.state==='ready').map(x=>x.id);
            for(const id of required) if(!ready.includes(id)) throw new Error(`Missing ${name} capability: ${id}`);
          }
          const restyle=services[0][1].capabilities.find(x=>x.id==='neural-restyle');
          const stt=services[2][1].capabilities.find(x=>x.id==='transcription');
          if(restyle?.state!=='model-not-trained'||stt?.state!=='model-not-trained') throw new Error('Untrained neural capability falsely marked ready');
          console.log('ATLAS Look, Subject and Speech foundations verified.');
          NODE

      - name: Verify ATLAS voice lip sync resolution independence
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/voice/capabilities -o /tmp/voice.json
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/lipsync/capabilities -o /tmp/lipsync.json
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/resolution/capabilities -o /tmp/resolution.json
          node - <<'NODE'
          const fs=require('fs');
          const services=[
            ['voice',JSON.parse(fs.readFileSync('/tmp/voice.json','utf8')),'atlas-voice-engine',['decode','metering','noise-gate','filters','eq','compressor','normalization','offline-render','wav-export']],
            ['lipsync',JSON.parse(fs.readFileSync('/tmp/lipsync.json','utf8')),'atlas-lipsync-engine',['speech-map-handoff','script-tokenization','orthography-viseme','segment-alignment','coalescing','timeline-export']],
            ['resolution',JSON.parse(fs.readFileSync('/tmp/resolution.json','utf8')),'atlas-resolution-engine',['image-ingest','video-frame','multipass-resample','unsharp-mask','edge-metric','png-export','recipe']]
          ];
          for(const [name,j,service,required] of services){
            if(j.service!==service) throw new Error(`${name} service mismatch`);
            if(!Array.isArray(j.externalProviders)||j.externalProviders.length!==0) throw new Error(`${name} external provider detected`);
            if(j.externalProviderRequired!==false||j.mediaLeavesDeviceByDefault!==false||j.localProcessing!==true) throw new Error(`${name} local-first policy mismatch`);
            const ready=(j.capabilities||[]).filter(x=>x.state==='ready').map(x=>x.id);
            for(const id of required) if(!ready.includes(id)) throw new Error(`Missing ${name} capability: ${id}`);
          }
          if(services[0][1].policy?.voiceIdentitySynthesisRequiresConsent!==true) throw new Error('Voice consent policy missing');
          if(services[1][1].policy?.approximateTimingIsNotPhonemeRecognition!==true) throw new Error('Lip Sync honesty policy missing');
          if(services[2][1].policy?.deterministicResampleIsNotNeuralDetailRecovery!==true) throw new Error('Resolution honesty policy missing');
          for(const id of ['voice-synthesis-model','voice-clone-model']) if(services[0][1].capabilities.find(x=>x.id===id)?.state!=='model-not-trained') throw new Error(`${id} falsely ready`);
          for(const id of ['neural-phoneme-model','facial-animation-model']) if(services[1][1].capabilities.find(x=>x.id===id)?.state!=='model-not-trained') throw new Error(`${id} falsely ready`);
          for(const id of ['neural-super-resolution','temporal-detail-recovery']) if(services[2][1].capabilities.find(x=>x.id===id)?.state!=='model-not-trained') throw new Error(`${id} falsely ready`);
          console.log('ATLAS Voice, Lip Sync and Resolution foundations verified.');
          NODE

      - name: Verify ATLAS Media QC independence
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/qc/capabilities -o /tmp/media-qc.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/media-qc.json','utf8'));
          if(j.service!=='atlas-media-qc') throw new Error('Media QC service mismatch');
          if(!Array.isArray(j.externalProviders) || j.externalProviders.length!==0) throw new Error('External QC provider detected');
          if(j.mediaLeavesDeviceByDefault!==false) throw new Error('Media QC local-first policy mismatch');
          const ready=(j.capabilities||[]).filter(x=>x.state==='ready').map(x=>x.id);
          for(const id of ['frame-sampling','exposure','contrast','sharpness','black-frames','audio-rms','audio-clipping','silence','release-report']) if(!ready.includes(id)) throw new Error(`Missing Media QC capability: ${id}`);
          console.log('ATLAS Media QC production contract verified.');
          NODE

      - name: Verify ATLAS Native Studio independence
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://atlasenterprisesuite.com/api/studio/production/health -o /tmp/native-studio-health.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/native-studio-health.json','utf8'));
          if(!j.ok || j.service!=='atlas-native-studio') throw new Error('Native Studio health contract mismatch');
          if(!Array.isArray(j.externalProviders) || j.externalProviders.length!==0) throw new Error('External provider detected');
          if(j.externalProviderRequired!==false || j.localProcessing!==true || j.mediaLeavesDeviceByDefault!==false) throw new Error('Native Studio first-party policy mismatch');
          const ready=(j.capabilities||[]).filter(x=>x.state==='ready').map(x=>x.id);
          for(const id of ['ingest','smart-cut','timeline','reframe','captions','audio','render']) if(!ready.includes(id)) throw new Error(`Missing native capability: ${id}`);
          console.log('ATLAS Native Studio production contract verified.');
          NODE

      - name: Verify TURN production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "https://atlasenterprisesuite.com/api/video/ice?room=deploycheck" -o /tmp/atlas-ice.json
          node -e "const j=require('/tmp/atlas-ice.json');if(!j.ok||!Array.isArray(j.iceServers)||!j.iceServers.some(s=>(Array.isArray(s.urls)?s.urls:[s.urls]).some(u=>/^turns?:/.test(String(u))))){console.error(j);process.exit(1)}"

      - name: Verify public website boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/ -o /tmp/atlas-home.html
          grep -Fq 'One platform.' /tmp/atlas-home.html
          grep -Fq 'Public preview outside. Authorized modules inside.' /tmp/atlas-home.html
          grep -Fq 'Preview only. Module access begins after sign-in and authorization.' /tmp/atlas-home.html
          if grep -Eq 'href="/(finance|hr|operations|ride|wallet|studio|workbench|browser)"' /tmp/atlas-home.html; then
            echo 'Public home exposes application module links' >&2
            exit 1
          fi
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/product | grep -Fq 'The ATLAS enterprise'
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS https://www.atlasenterprisesuite.com/trust | grep -Fq 'Security claims must be verifiable.'
          APP_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' https://www.atlasenterprisesuite.com/app)"
          [ "$APP_STATUS" = '307' ]

      - name: Mark production success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"atlas/production\",\"description\":\"ATLAS Creator and first-party media stack verified\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > /dev/null

      - name: Mark production failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"atlas/production\",\"description\":\"ATLAS production deployment failed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > /dev/null || true
