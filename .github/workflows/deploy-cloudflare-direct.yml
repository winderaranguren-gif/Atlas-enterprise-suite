name: Deploy ATLAS Cloudflare Adapter (Optional)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type cloudflare-adapter to run the optional Cloudflare deployment
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: atlas-cloudflare-adapter-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 1dd6dea2bb98459c66f610464354d686

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate ATLAS application contracts
        run: |
          npm run check:finance
          npm run check:launch
          npm run check:public-site
          npm run check:creator-web
          npm run check:universal-creator
          npm run check:native-studio
          npm run check:studio-autopilot
          npm run check:media-qc
          npm run check:media-foundations
          npm run check:voice-lipsync-resolution
          npm run check:neural-foundry
      - name: Validate optional Cloudflare adapter
        run: |
          node --check scripts/resolve-cloudflare-auth.mjs
          npx wrangler deploy --dry-run

  deploy:
    if: ${{ inputs.confirm == 'cloudflare-adapter' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Mark optional Cloudflare adapter deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"atlas/cloudflare-adapter\",\"description\":\"Optional Cloudflare adapter deployment\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
      - name: Resolve Cloudflare authentication
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/resolve-cloudflare-auth.mjs
      - name: Verify Cloudflare account access
        run: npx wrangler whoami
      - name: Verify TURN secrets exist for Cloudflare adapter
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx wrangler secret list)"
          printf '%s' "$LIST" | grep -q 'TURN_KEY_ID'
          printf '%s' "$LIST" | grep -q 'TURN_KEY_API_TOKEN'
      - name: Deploy optional ATLAS Cloudflare adapter
        run: npx wrangler deploy
      - name: Smoke-test optional adapter
        shell: bash
        run: |
          set -euo pipefail
          check(){ echo "Verifying $1"; curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "$1" > /dev/null; }
          check https://atlasenterprisesuite.com/healthz
          check https://atlasenterprisesuite.com/studio
          check https://atlasenterprisesuite.com/api/studio/health
          check https://atlasenterprisesuite.com/api/studio/creator/universal/capabilities
          check https://atlasenterprisesuite.com/api/studio/creator/web/capabilities
      - name: Mark optional Cloudflare adapter ready
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"atlas/cloudflare-adapter\",\"description\":\"Optional Cloudflare adapter verified\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
      - name: Mark optional Cloudflare adapter failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"atlas/cloudflare-adapter\",\"description\":\"Optional Cloudflare adapter failed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null || true
