name: ATLAS iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-build:
    name: ios-simulator-build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Validate and build ATLAS web assets
        run: npm run build
      - name: Generate clean iOS project in CI workspace
        run: |
          rm -rf ios
          npx cap add ios
      - name: Sync Capacitor plugins and assets
        run: npx cap sync ios
      - name: Verify native Xcode project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/Podfile
      - name: Build iOS Simulator app without signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
