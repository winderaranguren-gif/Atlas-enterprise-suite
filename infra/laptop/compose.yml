services:
  atlas-laptop:
    image: ${ATLAS_IMAGE:-ghcr.io/winderaranguren-gif/atlas-enterprise-suite:latest}
    container_name: atlas-laptop-01
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      ATLAS_RUNTIME_PROVIDER: atlas-laptop
      ATLAS_NODE_ID: atlas-laptop-01
      ATLAS_STATE_DIR: /var/lib/atlas
    volumes:
      - atlas_laptop_state:/var/lib/atlas
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/_atlas/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 4

volumes:
  atlas_laptop_state:
    name: atlas_laptop_state
