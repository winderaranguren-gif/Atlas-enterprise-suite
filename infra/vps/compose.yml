services:
  atlas:
    image: ${ATLAS_IMAGE:-ghcr.io/winderaranguren-gif/atlas-enterprise-suite:latest}
    container_name: atlas-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      ATLAS_RUNTIME_PROVIDER: atlas-vps
      ATLAS_STATE_DIR: /var/lib/atlas
    volumes:
      - atlas_state:/var/lib/atlas
    expose:
      - "8080"
    networks:
      - atlas_net
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/_atlas/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 4

  edge:
    image: caddy:2-alpine
    container_name: atlas-edge
    restart: unless-stopped
    depends_on:
      atlas:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - atlas_net
    security_opt:
      - no-new-privileges:true

volumes:
  atlas_state:
    name: atlas_vps_state
  caddy_data:
    name: atlas_vps_caddy_data
  caddy_config:
    name: atlas_vps_caddy_config

networks:
  atlas_net:
    name: atlas_vps_net
    driver: bridge
