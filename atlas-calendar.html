<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ATLAS Calendar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;background:var(--bg);color:var(--text)}
    .calendar-shell{max-width:1180px;margin:0 auto;padding:24px}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .calendar-brand{display:flex;align-items:center;gap:12px}.calendar-brand h1{margin:0;font-size:1.55rem}.calendar-brand p{margin:3px 0 0;color:var(--muted);font-size:.78rem}
    .calendar-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}
    .calendar-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.08)}
    .calendar-card h2{margin:0 0 14px;font-size:1.05rem}.calendar-form label{display:block;margin-top:12px;font-size:.74rem;font-weight:800;color:var(--muted)}.calendar-form textarea{min-height:84px;resize:vertical}
    .calendar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.agenda-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.agenda-list{display:grid;gap:10px}
    .event{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card-soft);display:grid;grid-template-columns:1fr auto;gap:14px}.event h3{margin:0;font-size:.95rem}.event p{margin:5px 0 0;color:var(--muted);font-size:.74rem;line-height:1.45}.event time{display:block;margin-top:8px;color:var(--cyan);font-weight:800;font-size:.78rem}.event-actions{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}.event.due{border-color:rgba(240,189,98,.55)}.event.done{opacity:.62}.event.highlighted{outline:2px solid var(--cyan);outline-offset:2px}
    .status-note{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(71,215,208,.08);border:1px solid rgba(71,215,208,.14);color:var(--muted);font-size:.72rem;line-height:1.5}.status-note[data-kind="ok"]{color:var(--green)}.status-note[data-kind="error"]{color:var(--red)}
    .empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.back-link{text-decoration:none}
    @media(max-width:820px){.calendar-grid{grid-template-columns:1fr}.calendar-head{align-items:flex-start;flex-direction:column}.calendar-shell{padding:16px;padding-top:max(16px,env(safe-area-inset-top))}.event{grid-template-columns:1fr}.event-actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <main class="calendar-shell">
    <header class="calendar-head">
      <div class="calendar-brand"><span class="atlas-logo">A</span><div><h1>ATLAS Calendar</h1><p>Agenda, eventos y recordatorios del ecosistema ATLAS.</p></div></div>
      <a class="button ghost back-link" href="index.html">← Volver a ATLAS</a>
    </header>

    <section class="calendar-grid">
      <article class="calendar-card">
        <h2>Nuevo evento</h2>
        <form id="event-form" class="calendar-form">
          <input id="event-id" type="hidden">
          <label>Título<input id="event-title" required placeholder="Ej. Revisar ATLAS"></label>
          <label>Fecha<input id="event-date" type="date" required></label>
          <label>Hora<input id="event-time" type="time" required></label>
          <label>Recordatorio<select id="event-reminder"><option value="0">A la hora</option><option value="5">5 minutos antes</option><option value="15">15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option></select></label>
          <label>Categoría<select id="event-category"><option>ATLAS</option><option>Personal</option><option>Finanzas</option><option>Trabajo</option><option>Legal</option><option>Otro</option></select></label>
          <label>Notas<textarea id="event-notes" placeholder="Detalles del evento"></textarea></label>
          <div class="calendar-actions">
            <button class="button primary" type="submit">Guardar evento</button>
            <button id="cancel-edit" class="button ghost hidden" type="button">Cancelar edición</button>
            <button id="enable-notifications" class="button ghost" type="button">Activar notificaciones</button>
          </div>
        </form>
        <div id="notification-status" class="status-note">Preparando el sistema de recordatorios de ATLAS Calendar…</div>
      </article>

      <article class="calendar-card">
        <div class="agenda-top"><div><h2>Próximos eventos</h2><div id="today-label" class="muted"></div></div><button id="clear-completed" class="button small ghost" type="button">Limpiar completados</button></div>
        <div id="agenda" class="agenda-list"></div>
      </article>
    </section>
  </main>
  <script src="atlas-calendar.js"></script>
</body>
</html>
