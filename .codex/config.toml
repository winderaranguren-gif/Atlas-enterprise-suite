# ATLAS project-scoped Codex MCP configuration
# OAuth is completed interactively by the MCP client when access is first authorized.

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.cloudflare-builds]
url = "https://builds.mcp.cloudflare.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60
